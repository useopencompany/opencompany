<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Starter kits — UX prototypes</title>
<!--
  Clickable prototype for docs/future-concepts/starter-kits.md.
  Self-contained on purpose: open this file in a browser, no build step.
  Colors, type sizes, and radii mirror apps/web/app/globals.css and the onboarding wizard.
-->
<style>
  :root {
    --canvas: #f7f7f5; --sidebar: #f1f1ef; --ink: #111111; --ink-muted: #6b6b6b;
    --ink-subtle: #9a9a96; --ink-faint: #b6b6b0; --border: #e6e6e3; --border-strong: #d4d4cf;
    --surface: #ffffff; --surface-muted: #fafaf7; --surface-subtle: #ececea;
    --surface-hover: #f3f3f0; --surface-active: #e3e3df; --success: #216b35;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, Inter, "Segoe UI", Roboto, sans-serif;
    font-feature-settings: "cv11", "ss01"; background: var(--canvas); color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  a { color: inherit; }
  a.btn, a.dir { text-decoration: none; }
  svg.i { width: var(--s, 16px); height: var(--s, 16px); fill: none; stroke: currentColor;
    stroke-width: var(--w, 1.9); stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }

  /* ---------- Onboarding chrome (matches OnboardingWizard) ---------- */
  .ob { display: flex; flex-direction: column; height: 100vh; }
  .progress { height: 3px; background: var(--surface-subtle); flex-shrink: 0; }
  .progress > div { height: 100%; background: var(--ink); }
  .ob main { flex: 1; overflow-y: auto; }
  .col { margin: 0 auto; max-width: 560px; min-height: 100%; padding: 48px 24px;
    display: flex; flex-direction: column; justify-content: center; }
  .col.wide { max-width: 640px; }
  .eyebrow { margin: 0 0 20px; font-size: 11.5px; font-weight: 500; text-transform: uppercase;
    letter-spacing: .08em; color: var(--ink-subtle); }
  h1 { margin: 0; font-size: 26px; font-weight: 600; line-height: 1.2; letter-spacing: -.02em; }
  .sub { margin: 8px 0 28px; font-size: 14px; line-height: 24px; color: var(--ink-muted); }
  .label { font-size: 12px; font-weight: 500; margin-bottom: 10px; display: block; }
  .nav { margin-top: 36px; display: flex; align-items: center; justify-content: space-between; }
  .btn { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; border: 0;
    background: var(--ink); color: var(--canvas); padding: 9px 20px; font-size: 13px; font-weight: 600; }
  .btn.ghost { background: transparent; color: var(--ink-muted); font-weight: 500; padding: 9px 12px; }
  .btn.outline { background: var(--surface); color: var(--ink); border: 1px solid var(--border); font-weight: 500; }
  .btn.sm { padding: 5px 12px; font-size: 12px; }
  .link { background: none; border: 0; padding: 0; font-size: 12.5px; color: var(--ink-subtle);
    text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--border-strong); }

  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .card { display: flex; align-items: center; gap: 12px; border: 1px solid var(--border);
    background: var(--surface); border-radius: 12px; padding: 12px 14px; text-align: left; width: 100%; }
  .card.active { border-color: var(--ink); background: color-mix(in srgb, var(--surface-active) 50%, var(--surface)); }
  .tile { width: 36px; height: 36px; border-radius: 8px; background: var(--surface-muted);
    color: var(--ink-muted); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .card.active .tile.role { background: var(--ink); color: var(--canvas); }
  .t { font-size: 13px; font-weight: 500; }
  .h { font-size: 11.5px; line-height: 16px; color: var(--ink-subtle); }
  .muted { color: var(--ink-muted); }
  .grow { flex: 1; min-width: 0; }
  .input { width: 100%; border: 1px solid var(--border); background: var(--surface); border-radius: 8px;
    padding: 8px 12px; font-size: 14px; color: var(--ink); }

  /* Kit list — one calm list, four rows */
  .kit { border: 1px solid var(--border); border-radius: 12px; background: var(--surface); overflow: hidden; }
  .kit-row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; }
  .kit-row + .kit-row { border-top: 1px solid var(--border); }
  .kit-row .items { font-size: 12px; line-height: 18px; color: var(--ink-subtle); }
  .pill { font-size: 11px; font-weight: 500; padding: 3px 9px; border-radius: 999px; white-space: nowrap;
    border: 1px solid var(--border); color: var(--ink-muted); background: var(--surface); }
  .pill.ok { color: var(--success); border-color: color-mix(in srgb, var(--success) 25%, transparent);
    background: color-mix(in srgb, var(--success) 7%, transparent); }
  .check-badge { width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center;
    justify-content: center; color: var(--success); background: color-mix(in srgb, var(--success) 10%, transparent); margin-bottom: 12px; }
  .toggle { width: 18px; height: 18px; border-radius: 5px; border: 1.5px solid var(--border-strong);
    display: flex; align-items: center; justify-content: center; flex-shrink: 0; background: var(--surface); }
  .toggle.on { background: var(--ink); border-color: var(--ink); color: var(--canvas); }

  /* Starter picker (direction B) */
  .kits { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .kitcard { border: 1px solid var(--border); background: var(--surface); border-radius: 12px;
    padding: 14px; text-align: left; display: flex; flex-direction: column; gap: 10px; min-height: 128px; }
  .kitcard.active { border-color: var(--ink); background: color-mix(in srgb, var(--surface-active) 50%, var(--surface)); }
  .kitcard .top { display: flex; align-items: center; justify-content: space-between; }
  .kitcard .desc { font-size: 12px; line-height: 18px; color: var(--ink-muted); }
  .kitcard .meta { margin-top: auto; font-size: 11.5px; color: var(--ink-subtle); }
  .suggested { font-size: 10.5px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase;
    color: var(--ink-muted); background: var(--surface-subtle); border-radius: 999px; padding: 2px 8px; }

  /* ---------- App shell (matches home screen) ---------- */
  .app { display: flex; height: 100vh; background: var(--sidebar); }
  .side { width: 248px; padding: 14px 8px; display: flex; flex-direction: column; flex-shrink: 0; }
  .ws { display: flex; align-items: center; gap: 10px; padding: 4px 8px 18px; font-size: 13.5px; font-weight: 500; }
  .ws .i { color: var(--ink-muted); }
  .nav-item { display: flex; align-items: center; gap: 10px; padding: 7px 10px; font-size: 13.5px;
    border-radius: 8px; color: var(--ink); }
  .nav-item.cur { background: var(--surface-active); }
  .nav-item .i { color: var(--ink-muted); --s: 15px; }
  .nav-item .count { margin-left: auto; font-size: 11.5px; color: var(--ink-subtle); }
  .nav-group { font-size: 11.5px; color: var(--ink-subtle); padding: 18px 10px 6px; display: flex; align-items: center; gap: 4px; }
  .new { font-size: 10px; font-weight: 600; color: var(--success); margin-left: auto;
    background: color-mix(in srgb, var(--success) 9%, transparent); padding: 1px 6px; border-radius: 999px; }
  .spacer { flex: 1; }
  .me { display: flex; align-items: center; gap: 10px; padding: 8px 10px; font-size: 13px; }
  .avatar { width: 28px; height: 28px; border-radius: 999px; background: var(--ink); color: var(--canvas);
    font-size: 12px; font-weight: 600; display: flex; align-items: center; justify-content: center; }
  .pane { flex: 1; margin: 8px 8px 8px 0; background: var(--canvas); border: 1px solid var(--border);
    border-radius: 12px; display: flex; flex-direction: column; overflow: hidden; }
  .pane-body { flex: 1; overflow-y: auto; display: flex; flex-direction: column; }
  .hero { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; padding: 0 24px; }
  .hero h2 { margin: 0; font-size: 26px; font-weight: 600; letter-spacing: -.02em; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; max-width: 720px; }
  .chip { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--border);
    background: var(--surface); border-radius: 999px; padding: 7px 14px; font-size: 13px; color: var(--ink); }
  .chip .i { --s: 14px; color: var(--ink-muted); }
  .composer-wrap { padding: 0 24px 22px; display: flex; justify-content: center; }
  .composer { width: 100%; max-width: 700px; border: 1px solid var(--border); background: var(--surface);
    border-radius: 14px; box-shadow: 0 4px 14px rgba(0,0,0,.04); }
  .composer .field { padding: 14px 16px; font-size: 14px; color: var(--ink-subtle); display: flex; align-items: center; }
  .composer .field .sendb { margin-left: auto; width: 28px; height: 28px; border-radius: 8px; background: var(--ink-faint);
    color: #fff; display: flex; align-items: center; justify-content: center; }
  .composer .tools { border-top: 1px solid var(--border); padding: 9px 14px; display: flex; gap: 16px;
    align-items: center; color: var(--ink-muted); font-size: 12.5px; }

  /* Chat (direction C) */
  .thread { width: 100%; max-width: 700px; margin: 0 auto; padding: 36px 24px 12px; display: flex; flex-direction: column; gap: 18px; }
  .msg-user { align-self: flex-end; background: var(--surface-subtle); border-radius: 14px; padding: 9px 14px; font-size: 14px; }
  .msg-agent { font-size: 14px; line-height: 23px; }
  .msg-agent p { margin: 0 0 10px; }
  .proposal { border: 1px solid var(--border); background: var(--surface); border-radius: 12px; overflow: hidden; }
  .proposal-head { padding: 12px 14px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--border); }
  .proposal-foot { padding: 10px 14px; display: flex; align-items: center; justify-content: space-between;
    border-top: 1px solid var(--border); background: var(--surface-muted); }
  .spin { animation: spin 1s linear infinite; color: var(--ink-subtle); }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------- Prototype index + frame bar ---------- */
  .protobar { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 10;
    background: #111; color: #eee; border-radius: 999px; padding: 6px 6px 6px 14px; display: flex;
    gap: 6px; align-items: center; font-size: 12px; box-shadow: 0 6px 24px rgba(0,0,0,.2); }
  .protobar a { color: #eee; text-decoration: none; padding: 5px 10px; border-radius: 999px; }
  .protobar a.cur { background: #333; }
  .protobar .sep { width: 1px; height: 16px; background: #444; }
  body.shot .protobar { display: none; }
  .index { max-width: 880px; margin: 0 auto; padding: 64px 24px; }
  .dirs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 28px; }
  .dir { border: 1px solid var(--border); background: var(--surface); border-radius: 12px; padding: 16px;
    text-decoration: none; display: flex; flex-direction: column; gap: 8px; }
  .dir .n { font-size: 11.5px; color: var(--ink-subtle); font-weight: 500; letter-spacing: .06em; text-transform: uppercase; }
</style>
</head>

<script>
const ICONS = {"rocket":"<path d=\"M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5\"/><path d=\"M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09\"/><path d=\"M9 12a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.4 22.4 0 0 1-4 2z\"/><path d=\"M9 12H4s.55-3.03 2-4c1.62-1.08 5 .05 5 .05\"/>","code-xml":"<path d=\"m18 16 4-4-4-4\"/><path d=\"m6 8-4 4 4 4\"/><path d=\"m14.5 4-5 16\"/>","target":"<circle cx=\"12\" cy=\"12\" r=\"10\"/><circle cx=\"12\" cy=\"12\" r=\"6\"/><circle cx=\"12\" cy=\"12\" r=\"2\"/>","megaphone":"<path d=\"M11 6a13 13 0 0 0 8.4-2.8A1 1 0 0 1 21 4v12a1 1 0 0 1-1.6.8A13 13 0 0 0 11 14H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2z\"/><path d=\"M6 14a12 12 0 0 0 2.4 7.2 2 2 0 0 0 3.2-2.4A8 8 0 0 1 10 14\"/><path d=\"M8 6v8\"/>","settings-2":"<path d=\"M14 17H5\"/><path d=\"M19 7h-9\"/><circle cx=\"17\" cy=\"17\" r=\"3\"/><circle cx=\"7\" cy=\"7\" r=\"3\"/>","check":"<path d=\"M20 6 9 17l-5-5\"/>","arrow-right":"<path d=\"M5 12h14\"/><path d=\"m12 5 7 7-7 7\"/>","arrow-left":"<path d=\"m12 19-7-7 7-7\"/><path d=\"M19 12H5\"/>","sparkles":"<path d=\"M11.017 2.814a1 1 0 0 1 1.966 0l1.051 5.558a2 2 0 0 0 1.594 1.594l5.558 1.051a1 1 0 0 1 0 1.966l-5.558 1.051a2 2 0 0 0-1.594 1.594l-1.051 5.558a1 1 0 0 1-1.966 0l-1.051-5.558a2 2 0 0 0-1.594-1.594l-5.558-1.051a1 1 0 0 1 0-1.966l5.558-1.051a2 2 0 0 0 1.594-1.594z\"/><path d=\"M20 2v4\"/><path d=\"M22 4h-4\"/><circle cx=\"4\" cy=\"20\" r=\"2\"/>","puzzle":"<path d=\"M15.39 4.39a1 1 0 0 0 1.68-.474 2.5 2.5 0 1 1 3.014 3.015 1 1 0 0 0-.474 1.68l1.683 1.682a2.414 2.414 0 0 1 0 3.414L19.61 15.39a1 1 0 0 1-1.68-.474 2.5 2.5 0 1 0-3.014 3.015 1 1 0 0 1 .474 1.68l-1.683 1.682a2.414 2.414 0 0 1-3.414 0L8.61 19.61a1 1 0 0 0-1.68.474 2.5 2.5 0 1 1-3.014-3.015 1 1 0 0 0 .474-1.68l-1.683-1.682a2.414 2.414 0 0 1 0-3.414L4.39 8.61a1 1 0 0 1 1.68.474 2.5 2.5 0 1 0 3.014-3.015 1 1 0 0 1-.474-1.68l1.683-1.682a2.414 2.414 0 0 1 3.414 0z\"/>","workflow":"<rect width=\"8\" height=\"8\" x=\"3\" y=\"3\" rx=\"2\"/><path d=\"M7 11v4a2 2 0 0 0 2 2h4\"/><rect width=\"8\" height=\"8\" x=\"13\" y=\"13\" rx=\"2\"/>","bot":"<path d=\"M12 8V4H8\"/><rect width=\"16\" height=\"12\" x=\"4\" y=\"8\" rx=\"2\"/><path d=\"M2 14h2\"/><path d=\"M20 14h2\"/><path d=\"M15 13v2\"/><path d=\"M9 13v2\"/>","send":"<path d=\"M14.536 21.686a.5.5 0 0 0 .937-.024l6.5-19a.496.496 0 0 0-.635-.635l-19 6.5a.5.5 0 0 0-.024.937l7.93 3.18a2 2 0 0 1 1.112 1.11z\"/><path d=\"m21.854 2.147-10.94 10.939\"/>","list-todo":"<path d=\"M13 5h8\"/><path d=\"M13 12h8\"/><path d=\"M13 19h8\"/><path d=\"m3 17 2 2 4-4\"/><rect x=\"3\" y=\"4\" width=\"6\" height=\"6\" rx=\"1\"/>","book-open":"<path d=\"M12 5v16\"/><path d=\"M20.001 19A2 2 0 0022 17V5a2 2 0 00-1.999-2L16 3.002A5 5 0 0012 5a5 5 0 00-4-2H4a2 2 0 00-2 2v12a2 2 0 001.999 2H8a5 5 0 014 2 5 5 0 014-2z\"/>","git-pull-request":"<circle cx=\"18\" cy=\"18\" r=\"3\"/><circle cx=\"6\" cy=\"6\" r=\"3\"/><path d=\"M13 6h3a2 2 0 0 1 2 2v7\"/><line x1=\"6\" x2=\"6\" y1=\"9\" y2=\"21\"/>","message-square":"<path d=\"M22 17a2 2 0 0 1-2 2H6.828a2 2 0 0 0-1.414.586l-2.202 2.202A.71.71 0 0 1 2 21.286V5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2z\"/>","calendar-clock":"<path d=\"M16 14v2.2l1.6 1\"/><path d=\"M16 2v3\"/><path d=\"M21 7.338V5a2 2 0 00-2-2H5a2 2 0 00-2 2v14a2 2 0 002 2h2.338\"/><path d=\"M3 9h5.859\"/><path d=\"M8 2v3\"/><circle cx=\"16\" cy=\"16\" r=\"6\"/>","plus":"<path d=\"M5 12h14\"/><path d=\"M12 5v14\"/>","chevron-down":"<path d=\"m6 9 6 6 6-6\"/>","loader-circle":"<path d=\"M21 12a9 9 0 1 1-6.219-8.56\"/>","file-text":"<path d=\"M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z\"/><path d=\"M14 2v5a1 1 0 0 0 1 1h5\"/><path d=\"M10 9H8\"/><path d=\"M16 13H8\"/><path d=\"M16 17H8\"/>","lightbulb":"<path d=\"M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5\"/><path d=\"M9 18h6\"/><path d=\"M10 22h4\"/>","circle-check":"<circle cx=\"12\" cy=\"1 const ic = (n, s = 16, w) => `<svg class="i" viewBox="0 0 24 24" style="--s:${s}px${w ? `;--w:${w}` : ""}">${ICONS[n] || ""}</svg>`;

// One kit, shown the same way in every direction. It is real workspace content — ordinary skills,
// plugins, a workflow, and an agent — not a new "template" object the user has to learn.
const KIT = {
  name: "Technical founder",
  groups: [
    { icon: "sparkles", title: "4 skills", items: "Write a PR description · Investor update · Customer call notes · YC office hours", status: "ok" },
    { icon: "puzzle", title: "3 plugins", items: "GitHub · Linear · YC Advise", status: "GitHub, Linear" },
    { icon: "workflow", title: "Weekly shipping digest", items: "Fridays at 4pm — what shipped, from GitHub, posted to Slack", status: "Slack" },
    { icon: "bot", title: "Chief of staff", items: "Company agent that answers the team from your Wiki, GitHub, and Linear", status: "ok" },
  ],
};
const STARTER_PROMPTS = [
  ["git-pull-request", "What shipped this week?"],
  ["trending-up", "Draft this month's investor update"],
  ["lightbulb", "Office hours: how should we price?"],
];

const pill = (s) => s === "ok" ? `<span class="pill ok">Ready</span>` : `<span class="pill">Connect ${s.split(",")[0]}</span>`;

function onboarding(stepIndex, total, body, nav, wide) {
  return `<div class="ob"><div class="progress"><div style="width:${((stepIndex + 1) / total) * 100}%"></div></div>
    <main><div class="col${wide ? " wide" : ""}"><p class="eyebrow">Step ${stepIndex + 1} of ${total}</p>${body}${nav}</div></main></div>`;
}
function navRow(back, next, label, extra = "") {
  return `<div class="nav"><a class="btn ghost" href="#${back}">${ic("arrow-left", 15, 2)} Back</a>
    <span style="display:flex;align-items:center;gap:16px">${extra}<a class="btn" href="#${next}">${label} ${label.startsWith("Open") ? "" : ic("arrow-right", 15, 2)}</a></span></div>`;
}

const ROLES = [
  ["rocket", "Founder / CEO", "Running the whole company"],
  ["code-xml", "Product / Engineering", "Building the product"],
  ["target", "Sales / GTM", "Pipeline & closing deals"],
  ["megaphone", "Marketing / Growth", "Demand & brand"],
];
function profileStep(total, next) {
  const roles = ROLES.map(([i, l, h], k) => `<div class="card${k === 0 ? " active" : ""}"><div class="tile role">${ic(i, 17)}</div>
    <div class="grow"><div class="t">${l}</div><div class="h">${h}</div></div>${k === 0 ? ic("check", 15, 2.4) : ""}</div>`).join("");
  return onboarding(0, total, `<h1>Welcome, Sam</h1>
    <p class="sub">Tell us a little about your role and company before we set up your workspace.</p>
    <span class="label">What best describes your role?</span><div class="grid2">${roles}</div>
    <div style="margin-top:24px"><span class="label" style="margin-bottom:6px">Company URL</span><div class="input">https://acme.dev</div>
    <div class="h" style="margin-top:6px">We use your role and site to set up a starter workspace for you.</div></div>`,
    `<div class="nav"><span></span><a class="btn" href="#${next}">Continue ${ic("arrow-right", 15, 2)}</a></div>`);
}

function kitList({ toggles = false } = {}) {
  return `<div class="kit">${KIT.groups.map((g) => `<div class="kit-row">
    ${toggles ? `<span class="toggle on">${ic("check", 12, 3)}</span>` : ""}
    <div class="tile">${ic(g.icon, 17)}</div>
    <div class="grow"><div class="t">${g.title}</div><div class="items">${g.items}</div></div>${pill(g.status)}</div>`).join("")}</div>`;
}

function appShell({ counts = true, highlight = false, pane }) {
  const n = (label, icon, count, cur) => `<div class="nav-item${cur ? " cur" : ""}">${ic(icon)}<span>${label}</span>
    ${counts && count ? (highlight ? `<span class="new">${count} new</span>` : `<span class="count">${count}</span>`) : ""}</div>`;
  return `<div class="app"><aside class="side">
    <div class="ws">${ic("panel-left", 16)}${ic("globe", 16)}<span>Acme</span><span style="margin-left:auto">${ic("chevrons-up-down", 14)}</span></div>
    ${n("New Chat", "send", 0, true)}${n("Tasks", "list-todo")}${n("Workflows", "workflow", 1)}${counts ? n("Agents", "bot", 1) : ""}
    <div class="nav-group">Wiki ${ic("chevron-down", 12)}</div><div class="nav-item">${ic("book-open")}<span>Company</span></div>
    <div class="spacer"></div>
    ${n("Plugins", "puzzle", 3)}${n("Skills", "sparkles", 4)}
    <div class="me"><span class="avatar">S</span><div><div>Sam Rivera</div><div class="h">Hobby plan</div></div></div>
  </aside><section class="pane">${pane}</section></div>`;
}
const composer = `<div class="composer-wrap"><div class="composer"><div class="field">Ask a question or describe a task…
  <span class="sendb">${ic("arrow-right", 14, 2.2)}</span></div>
  <div class="tools">${ic("at-sign", 15)}${ic("plus", 15)}${ic("mic", 15)}<span>Kimi K3 ${ic("chevron-down", 12)}</span></div></div></div>`;
const chips = (align = "center") => `<div class="chips" style="justify-content:${align}">${STARTER_PROMPTS.map(([i, t]) => `<span class="chip">${ic(i)}${t}</span>`).join("")}</div>`;

// Keyed by the URL hash, which is user input — a Map lookup can only return a screen we defined.
const SCREENS = new Map(Object.entries({
  // ----- Direction A: Starts ready — the role they already pick decides the kit. No new step.
  "a-1": () => profileStep(5, "a-2"),
  "a-2": () => onboarding(4, 5, `<div class="check-badge">${ic("check", 22, 2.6)}</div>
    <h1>Acme is ready</h1>
    <p class="sub">We set it up for a technical founder <a class="link" href="#a-2">Change</a><br />It's all yours to edit or remove.</p>
    ${kitList()}
    <p class="h" style="margin-top:12px">Connect GitHub, Linear, and Slack to turn everything on — or do it later from Plugins.</p>`,
    navRow("a-1", "a-3", "Open workspace", `<a class="link" href="#a-3">Start empty instead</a>`)),
  "a-3": () => appShell({ highlight: false, pane: `<div class="pane-body"><div class="hero"><h2>What should we build next, Sam?</h2>${chips()}</div></div>${composer}` }),

  // ----- Direction B: Pick a starter — one explicit step, suggested from their role.
  "b-1": () => profileStep(6, "b-2"),
  "b-2": () => {
    const kits = [
      ["code-xml", "Technical founder", "Ship, review, and report on what the team builds.", "GitHub · Linear · shipping digest", true],
      ["target", "Go-to-market founder", "Find leads, run follow-ups, and track pipeline.", "Gmail · HubSpot · lead research"],
      ["settings-2", "Operator", "Inbox, calendar, revenue, and weekly reporting.", "Gmail · Calendar · Stripe"],
      ["circle-dashed", "Start empty", "A blank workspace. Add things as you need them.", "Nothing installed"],
    ];
    return onboarding(1, 6, `<h1>Pick a starting point</h1>
      <p class="sub">Each one comes with skills, plugins, a workflow, and a company agent. You can change everything later.</p>
      <div class="kits">${kits.map(([i, t, d, m, a]) => `<div class="kitcard${a ? " active" : ""}"><div class="top"><div class="tile${a ? " role" : ""}" ${a ? 'style="background:var(--ink);color:var(--canvas)"' : ""}>${ic(i, 17)}</div>
        ${a ? `<span class="suggested">Suggested</span>` : ""}</div><div><div class="t">${t}</div><div class="desc">${d}</div></div><div class="meta">${m}</div></div>`).join("")}</div>`,
      navRow("b-1", "b-3", "Continue"), true);
  },
  "b-3": () => onboarding(1, 6, `<h1>Technical founder</h1>
      <p class="sub">Here's what goes into Acme. Untick anything you don't want.</p>${kitList({ toggles: true })}`,
      navRow("b-2", "b-4", "Add to workspace")),
  "b-4": () => appShell({ highlight: true, pane: `<div class="pane-body"><div class="hero"><h2>What should we build next, Sam?</h2>${chips()}</div></div>${composer}` }),

  // ----- Direction C: Set up in chat — the agent reads their site and proposes the kit in the first chat.
  "c-1": () => profileStep(5, "c-2"),
  "c-2": () => appShell({ counts: false, pane: `<div class="pane-body"><div class="thread">
      <div class="msg-agent"><p>Hi Sam — I read <u>acme.dev</u>. You're building developer tooling, and your repo is on GitHub.</p>
      <p>Here's a starting setup for a technical founder. Want me to add it?</p></div>
      <div class="proposal"><div class="proposal-head">${ic("layout-grid", 16)}<span class="t">Starter setup for Acme</span><span class="h" style="margin-left:auto">9 items</span></div>
        ${kitList({ toggles: true }).replace('class="kit"', 'class="kit" style="border:0;border-radius:0"')}
        <div class="proposal-foot"><span class="h">You can change or remove any of this later.</span>
        <span style="display:flex;gap:8px"><a class="btn outline sm" href="#c-2">Not now</a><a class="btn sm" href="#c-3">Set it up</a></span></div></div>
    </div></div>${composer}` }),
  "c-3": () => appShell({ highlight: true, pane: `<div class="pane-body"><div class="thread">
      <div class="msg-agent"><p>Hi Sam — I read <u>acme.dev</u>. You're building developer tooling, and your repo is on GitHub.</p></div>
      <div class="msg-user">Set it up</div>
      <div class="msg-agent"><p>Done. Here's what I added:</p></div>
      <div class="kit">${KIT.groups.map((g) => `<div class="kit-row"><span style="color:var(--success)">${ic("circle-check", 17)}</span>
        <div class="grow"><div class="t">${g.title}</div><div class="items">${g.items}</div></div>${g.status === "ok" ? `<span class="pill ok">Ready</span>` : `<a class="btn outline sm">Connect ${g.status.split(",")[0]}</a>`}</div>`).join("")}</div>
      <div class="msg-agent"><p>Try one:</p></div>${chips("flex-start")}
    </div></div>${composer}` }),
}));

const FLOWS = {
  a: { name: "A · Starts ready", screens: ["a-1", "a-2", "a-3"] },
  b: { name: "B · Pick a starter", screens: ["b-1", "b-2", "b-3", "b-4"] },
  c: { name: "C · Set up in chat", screens: ["c-1", "c-2", "c-3"] },
};

function index() {
  const d = (k, sum, steps) => `<a class="dir" href="#${FLOWS[k].screens[0]}"><span class="n">Direction ${k.toUpperCase()}</span>
    <span class="t" style="font-size:15px">${FLOWS[k].name.slice(4)}</span><span class="desc h" style="font-size:12.5px;line-height:19px">${sum}</span>
    <span class="h">${steps}</span></a>`;
  return `<div class="index"><p class="eyebrow">Prototype</p><h1>Starter kits</h1>
    <p class="sub">A new workspace should do something useful in its first 30 seconds. Three ways to get there, same kit in each.</p>
    <div class="dirs">${d("a", "The role you already pick decides the kit. The last onboarding screen shows what's in your workspace.", "0 new steps · 0 new concepts")}
    ${d("b", "An explicit step to choose a kit, suggested from your role, with a preview you can trim.", "+2 screens · adds a choice")}
    ${d("c", "Onboarding stays as is. Your first chat opens with the agent proposing a setup from your site.", "0 new steps · depends on an agent run")}</div></div>`;
}

function render() {
  const id = location.hash.slice(1) || "index";
  document.body.classList.toggle("shot", new URLSearchParams(location.search).has("shot"));
  const root = document.getElementById("root");
  const screen = SCREENS.get(id);
  const known = typeof screen === "function";
  root.innerHTML = known ? screen() : index();
  const flow = known && FLOWS[id[0]];
  if (flow) {
    root.insertAdjacentHTML("beforeend", `<nav class="protobar"><a href="#index">All directions</a><span class="sep"></span><span>${flow.name}</span>
      ${flow.screens.map((s, k) => `<a href="#${s}" class="${s === id ? "cur" : ""}">${k + 1}</a>`).join("")}</nav>`);
  }
}
addEventListener("hashchange", render);
render();
</script>
</body>
</html>
