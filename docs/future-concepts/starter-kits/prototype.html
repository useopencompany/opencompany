<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Starter setup for technical founders — prototype</title>
<!--
  Clickable prototype for docs/future-concepts/starter-kits.md.
  Self-contained on purpose: open this file in a browser, no build step.
  Colors, type sizes, radii, and brand marks mirror apps/web (globals.css, OnboardingWizard,
  service-marks). The repository, company, and person are fictional.
-->
<style>
  :root {
    --canvas: #f7f7f5; --sidebar: #f1f1ef; --ink: #111111; --ink-muted: #6b6b6b;
    --ink-subtle: #9a9a96; --ink-faint: #b6b6b0; --border: #e6e6e3; --border-strong: #d4d4cf;
    --surface: #ffffff; --surface-muted: #fafaf7; --surface-subtle: #ececea;
    --surface-hover: #f3f3f0; --surface-active: #e3e3df; --success: #216b35;
    --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, Inter, "Segoe UI", Roboto, sans-serif;
    font-feature-settings: "cv11", "ss01"; background: var(--canvas); color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; }
  a.btn, a.row-link { text-decoration: none; }
  svg.i { width: var(--s, 16px); height: var(--s, 16px); fill: none; stroke: currentColor;
    stroke-width: var(--w, 1.9); stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
  code, .mono { font-family: var(--mono); font-size: .92em; }

  /* ---------- Onboarding chrome (matches OnboardingWizard) ---------- */
  .ob { display: flex; flex-direction: column; height: 100vh; }
  .progress { height: 3px; background: var(--surface-subtle); flex-shrink: 0; }
  .progress > div { height: 100%; background: var(--ink); }
  .ob main { flex: 1; overflow-y: auto; }
  .col { margin: 0 auto; max-width: 560px; min-height: 100%; padding: 48px 24px;
    display: flex; flex-direction: column; justify-content: center; }
  .eyebrow { margin: 0 0 20px; font-size: 11.5px; font-weight: 500; text-transform: uppercase;
    letter-spacing: .08em; color: var(--ink-subtle); }
  h1 { margin: 0; font-size: 26px; font-weight: 600; line-height: 1.2; letter-spacing: -.02em; }
  .sub { margin: 8px 0 28px; font-size: 14px; line-height: 24px; color: var(--ink-muted); }
  .label { font-size: 12px; font-weight: 500; margin: 0 0 10px; display: block; }
  .nav { margin-top: 36px; display: flex; align-items: center; justify-content: space-between; }
  .btn { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; border: 0;
    background: var(--ink); color: var(--canvas); padding: 9px 20px; font-size: 13px; font-weight: 600; white-space: nowrap; }
  .btn.ghost { background: transparent; color: var(--ink-muted); font-weight: 500; padding: 9px 12px; }
  .btn.outline { background: var(--surface); color: var(--ink); border: 1px solid var(--border); font-weight: 500; }
  .btn.sm { padding: 5px 12px; font-size: 12px; }
  .link { font-size: inherit; color: var(--ink-subtle); text-decoration: underline;
    text-underline-offset: 3px; text-decoration-color: var(--border-strong); }

  .tile { width: 36px; height: 36px; border-radius: 8px; background: var(--surface-muted);
    color: var(--ink-muted); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .tile.mark { border: 1px solid rgba(0,0,0,.06); }
  .tile.mark svg { width: 52%; height: 52%; }
  .t { font-size: 13px; font-weight: 500; }
  .h { font-size: 11.5px; line-height: 16px; color: var(--ink-subtle); }
  .grow { flex: 1; min-width: 0; }

  .list { border: 1px solid var(--border); border-radius: 12px; background: var(--surface); overflow: hidden; }
  .row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; }
  .row + .row { border-top: 1px solid var(--border); }
  .row .d { font-size: 12px; line-height: 18px; color: var(--ink-subtle); }
  .why { font-family: var(--mono); font-size: 11px; color: var(--ink-subtle); }
  .done { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 500; color: var(--success); }
  .pill { font-size: 11px; font-weight: 500; padding: 3px 9px; border-radius: 999px; white-space: nowrap;
    color: var(--success); border: 1px solid color-mix(in srgb, var(--success) 25%, transparent);
    background: color-mix(in srgb, var(--success) 7%, transparent); }
  .check-badge { width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center;
    justify-content: center; color: var(--success); background: color-mix(in srgb, var(--success) 10%, transparent); margin-bottom: 12px; }
  .section + .section { margin-top: 22px; }
  .hero-card { border: 1px solid var(--border); background: var(--surface); border-radius: 12px; padding: 22px;
    display: flex; flex-direction: column; align-items: flex-start; gap: 14px; }
  .fine { margin-top: 12px; display: flex; align-items: center; gap: 6px; }
  .spin { animation: spin 1s linear infinite; color: var(--ink-subtle); }
  @keyframes spin { to { transform: rotate(360deg); } }
  .handle { font-family: var(--mono); font-size: 13px; font-weight: 600; }

  /* ---------- App shell (matches home screen) ---------- */
  .app { display: flex; height: 100vh; background: var(--sidebar); }
  .side { width: 248px; padding: 14px 8px; display: flex; flex-direction: column; flex-shrink: 0; }
  .ws { display: flex; align-items: center; gap: 10px; padding: 4px 8px 18px; font-size: 13.5px; font-weight: 500; }
  .ws .i { color: var(--ink-muted); }
  .nav-item { display: flex; align-items: center; gap: 10px; padding: 7px 10px; font-size: 13.5px; border-radius: 8px; }
  .nav-item.cur { background: var(--surface-active); }
  .nav-item .i { color: var(--ink-muted); --s: 15px; }
  .nav-item .count { margin-left: auto; font-size: 11.5px; color: var(--ink-subtle); }
  .nav-group { font-size: 11.5px; color: var(--ink-subtle); padding: 18px 10px 6px; display: flex; align-items: center; gap: 4px; }
  .spacer { flex: 1; }
  .me { display: flex; align-items: center; gap: 10px; padding: 8px 10px; font-size: 13px; }
  .avatar { width: 28px; height: 28px; border-radius: 999px; background: var(--ink); color: var(--canvas);
    font-size: 12px; font-weight: 600; display: flex; align-items: center; justify-content: center; }
  .pane { flex: 1; margin: 8px 8px 8px 0; background: var(--canvas); border: 1px solid var(--border);
    border-radius: 12px; display: flex; flex-direction: column; overflow: hidden; }
  .hero { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; padding: 0 24px; }
  .hero h2 { margin: 0; font-size: 26px; font-weight: 600; letter-spacing: -.02em; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; max-width: 720px; }
  .chip { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--border);
    background: var(--surface); border-radius: 999px; padding: 7px 14px; font-size: 13px; text-decoration: none; }
  .chip .i { --s: 14px; color: var(--ink-muted); }
  .chip b { font-family: var(--mono); font-size: 12.5px; font-weight: 600; }
  .composer-wrap { padding: 0 24px 22px; display: flex; justify-content: center; }
  .composer { position: relative; width: 100%; max-width: 700px; border: 1px solid var(--border); background: var(--surface);
    border-radius: 14px; box-shadow: 0 4px 14px rgba(0,0,0,.04); }
  .composer .field { padding: 14px 16px; font-size: 14px; color: var(--ink-subtle); display: flex; align-items: center; }
  .composer .field.typed { color: var(--ink); }
  .caret { display: inline-block; width: 1.5px; height: 17px; background: var(--ink); margin-left: 1px; vertical-align: -3px; }
  .sendb { margin-left: auto; width: 28px; height: 28px; border-radius: 8px; background: var(--ink-faint);
    color: #fff; display: flex; align-items: center; justify-content: center; }
  .composer .tools { border-top: 1px solid var(--border); padding: 9px 14px; display: flex; gap: 16px;
    align-items: center; color: var(--ink-muted); font-size: 12.5px; }
  .menu { position: absolute; left: 12px; bottom: calc(100% + 6px); width: 380px; background: var(--surface);
    border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,.08); padding: 6px; }
  .menu-item { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; }
  .menu-item.cur { background: var(--surface-hover); }
  .menu-item .tile { width: 28px; height: 28px; border-radius: 7px; }
  .menu-head { font-size: 11px; color: var(--ink-subtle); padding: 6px 10px 4px; }

  /* ---------- Prototype chrome ---------- */
  .protobar { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 10;
    background: #111; color: #eee; border-radius: 999px; padding: 6px 6px 6px 14px; display: flex;
    gap: 4px; align-items: center; font-size: 12px; box-shadow: 0 6px 24px rgba(0,0,0,.2); }
  .protobar a { color: #eee; text-decoration: none; padding: 5px 10px; border-radius: 999px; }
  .protobar a.cur { background: #333; }
  body.shot .protobar { display: none; }
  .index { max-width: 640px; margin: 0 auto; padding: 64px 24px; }
  .index .row { text-decoration: none; }
  .index .num { width: 24px; font-size: 12px; color: var(--ink-subtle); font-variant-numeric: tabular-nums; }
</style>
</head>

2.522A2.528 2.528 0 0 1 0 8.834a2.528 2.528 0 0 1 2.522-2.521h6.312zM18.956 8.834a2.528 2.528 0 0 1 2.522-2.521A2.528 2.528 0 0 1 24 8.834a2.528 2.528 0 0 1-2.522 2.521h-2.522V8.834zM17.688 8.834a2.528 2.528 0 0 1-2.523 2.521 2.527 2.527 0 0 1-2.52-2.521V2.522A2.527 2.527 0 0 1 15.165 0a2.528 2.528 0 0 1 2.523 2.522v6.312zM15.165 18.956a2.528 2.528 0 0 1 2.523 2.522A2.528 2.528 0 0 1 15.165 24a2.527 2.527 0 0 1-2.52-2.522v-2.522h2.52zM15.165 17.688a2.527 2.527 0 0 1-2.52-2.523 2.526 2.526 0 0 1 2.52-2.52h6.313A2.527 2.527 0 0 1 24 15.165a2.528 2.528 0 0 1-2.522 2.523h-6.313z\"></path></svg>","gmail":"<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"currentColor\" aria-hidden=\"true\"><path d=\"M24 5.457v13.909c0 .904-.732 1.636-1.636 1.636h-3.819V11.73L12 16.64l-6.545-4.91v9.273H1.636A1.636 1.636 0 0 1 0 19.366V5.457c0-2.023 2.309-3.178 3.927-1.964L5.455 4.64 12 9.548l6.545-4.91 1.528-1.145C21.69 2.28 24 3.434 24 5.457z\"></path></svg>","posthog":"<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"currentColor\" aria-hidden=\"true\"><path d=\"M9.854 14.5 5 9.647.854 5.5A.5.5 0 0 0 0 5.854V8.44a.5.5 0 0 0 .146.353L5 13.647l.147.146L9.854 18.5l.146.147v-.049c.065.03.134.049.207.049h2.586a.5.5 0 0 0 .353-.854L9.854 14.5zm0-5-4-4a.487.487 0 0 0-.409-.144.515.515 0 0 0-.356.21.493.493 0 0 0-.089.288V8.44a.5.5 0 0 0 .147.353l9 9a.5.5 0 0 0 .853-.354v-2.585a.5.5 0 0 0-.146-.354l-5-5zm1-4a.5.5 0 0 0-.854.354V8.44a.5.5 0 0 0 .147.353l4 4a.5.5 0 0 0 .853-.354V9.854a.5.5 0 0 0-.146-.354l-4-4zm12.647 11.515a3.863 3.863 0 0 1-2.232-1.1l-4.708-4.707a.5.5 0 0 0-.854.354v6.585a.5.5 0 0 0 .5.5H23.5a.5.5 0 0 0 .5-.5v-.6c0-.276-.225-.497-.499-.532zm-5.394.032a.8.8 0 1 1 0-1.6.8.8 0 0 1 0 1.6zM.854 15.5a.5.5 0 0 0-.854.354v2.293a.5.5 0 0 0 .5.5h2.293c.222 0 .39-.135.462-.309a.493.493 0 0 0-.109-.545L.854 15.501zM5 14.647.854 10.5a.5.5 0 0 0-.854.353v2.586a.5.5 0 0 0 .146.353L4.854 18.5l.146.147h2.793a.5.5 0 0 0 .353-.854L5 14.647z\"></path></svg>","render":"<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"currentColor\" aria-hidden=\"true\"><path d=\"m17.1491 1.50583c-2.6812-.1262-4.9358 1.81264-5.3205 4.36717-.0152.11854-.0381.23327-.0571.34799-.5979 3.18169-3.38195 5.59091-6.7258 5.59091-1.19206 0-2.31175-.3059-3.28672-.8413-.11807-.065-.25898.0191-.25898.1529v.6846 10.3137h10.2677v-7.7324c0-1.4226 1.1501-2.5775 2.5669-2.5775h2.5669c2.9059 0 5.2443-2.42069 5.13-5.36528-.1028-2.65013-2.2431-4.8146-4.8824-4.94079z\"></path></svg>","stripe":"<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"currentColor\" aria-hidden=\"true\"><path d=\"M13.976 9.15c-2.172-.806-3.356-1.426-3.356-2.409 0-.831.683-1.305 1.901-1.305 2.23 0 4.515.851 6.086 1.496l.89-5.494C18.252.95 15.72 0 12.232 0 9.804 0 7.78.637 6.332 1.824 4.828 3.069 4.062 4.874 4.062 7.133c0 4.1 2.504 5.851 6.563 7.315 2.616.937 3.491 1.609 3.491 2.635 0 .989-.85 1.561-2.396 1.561-1.91 0-5.067-.945-7.185-2.215l-.89 5.555C5.439 23.002 8.72 24 12.209 24c2.563 0 4.708-.625 6.156-1.813 1.609-1.305 2.436-3.25 2.436-5.773 0-4.183-2.558-5.852-6.825-7.264z\"></path></svg>","neon":"<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"currentColor\" aria-hidden=\"true\"><path d=\"M24 0V24l-9.365-8.045V24H0V0ZM2.942 21.087h8.751V9.563l9.365 8.204V2.919L2.942 2.914Z\"></path></svg>","resend":"<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"450 450 900 900\" fill=\"currentColor\" aria-hidden=\"true\"><path d=\"M1000.46 450C1174.77 450 1278.43 553.669 1278.43 691.282C1278.43 828.896 1174.77 932.563 1000.46 932.563H912.382L1350 1350H1040.82L707.794 1033.48C683.944 1011.47 672.936 985.781 672.935 963.765C672.935 932.572 694.959 905.049 737.161 893.122L908.712 847.244C973.85 829.812 1018.81 779.353 1018.81 713.298C1018.8 632.567 952.745 585.78 871.095 585.78H450V450H1000.46Z\"></path></svg>"};
const ic = (n, s = 16, w) => `<svg class="i" viewBox="0 0 24 24" style="--s:${s}px${w ? `;--w:${w}` : ""}">${ICONS[n] || ""}</svg>`;

// Tile colors copied from SERVICE_MARKS in apps/web/lib/service-marks.tsx.
const SERVICES = {
  github: { name: "GitHub", bg: "#181717", fg: "#fff" },
  posthog: { name: "PostHog", bg: "#F54E00", fg: "#fff" },
  render: { name: "Render", bg: "#0B0D0E", fg: "#fff" },
  stripe: { name: "Stripe", bg: "#635BFF", fg: "#fff" },
  linear: { name: "Linear", bg: "#5E6AD2", fg: "#fff" },
  slack: { name: "Slack", bg: "#fff", fg: "#4A154B" },
  gmail: { name: "Gmail", bg: "#fff", fg: "#EA4335" },
};
const mark = (slug, size = 36) => {
  const s = SERVICES[slug];
  return `<span class="tile mark" style="width:${size}px;height:${size}px;border-radius:${Math.round(size / 4.5)}px;background:${s.bg};color:${s.fg}">${MARKS[slug]}</span>`;
};

const REPO = "acme/app";
// What the scan found, and why. Each reason names the file, so a suggestion is never a mystery.
const FOUND = [
  { slug: "posthog", why: "posthog-js in package.json", connected: true },
  { slug: "render", why: "render.yaml" },
  { slug: "stripe", why: "stripe in apps/api/package.json" },
];
const TEAM = [
  { slug: "linear", why: "Issues and roadmap" },
  { slug: "slack", why: "Where the team talks" },
  { slug: "gmail", why: "Your inbox" },
];
const WORKFLOWS = [
  { handle: "build", name: "Build", icon: "hammer", menu: "Describe a change, get a pull request.", text: `Describe a change. It writes the code in ${REPO} and opens a pull request.` },
  { handle: "review-pr", name: "Review PR", icon: "git-pull-request", menu: "Review a pull request and comment on it.", text: "Point it at a pull request. It reviews the diff and comments on GitHub." },
];

const TOTAL = 5; // profile, workspace, subscriptions, code, finish
function onboarding(stepIndex, body, nav) {
  return `<div class="ob"><div class="progress"><div style="width:${((stepIndex + 1) / TOTAL) * 100}%"></div></div>
    <main><div class="col"><p class="eyebrow">Step ${stepIndex + 1} of ${TOTAL}</p>${body}${nav}</div></main></div>`;
}
const navRow = (back, next, label, arrow = true) => `<div class="nav"><a class="btn ghost" href="#${back}">${ic("arrow-left", 15, 2)} Back</a>
  <a class="btn" href="#${next}">${label} ${arrow ? ic("arrow-right", 15, 2) : ""}</a></div>`;

const serviceRow = ({ slug, why, connected }, mono) => `<div class="row">${mark(slug)}
  <div class="grow"><div class="t">${SERVICES[slug].name}</div><div class="${mono ? "why" : "d"}">${why}</div></div>
  ${connected ? `<span class="done">${ic("check", 14, 2.4)} Connected</span>` : `<a class="btn outline sm" href="#">Connect</a>`}</div>`;

function appShell(pane) {
  const n = (label, icon, count, cur) => `<div class="nav-item${cur ? " cur" : ""}">${ic(icon)}<span>${label}</span>
    ${count ? `<span class="count">${count}</span>` : ""}</div>`;
  return `<div class="app"><aside class="side">
    <div class="ws">${ic("panel-left", 16)}${ic("globe", 16)}<span>Acme</span><span style="margin-left:auto">${ic("chevrons-up-down", 14)}</span></div>
    ${n("New Chat", "send", 0, true)}${n("Tasks", "list-todo")}${n("Workflows", "workflow", 2)}
    <div class="nav-group">Wiki ${ic("chevron-down", 12)}</div>${n("Company", "book-open")}
    <div class="spacer"></div>${n("Plugins", "puzzle", 2)}${n("Skills", "sparkles")}
    <div class="me"><span class="avatar">S</span><div><div>Sam Rivera</div><div class="h">Hobby plan</div></div></div>
  </aside><section class="pane">${pane}</section></div>`;
}
function composer({ typed = "", menu = false } = {}) {
  const field = typed
    ? `<div class="field typed">${typed}<span class="caret"></span><span class="sendb">${ic("arrow-right", 14, 2.2)}</span></div>`
    : `<div class="field">Ask a question or describe a task…<span class="sendb">${ic("arrow-right", 14, 2.2)}</span></div>`;
  const items = menu ? `<div class="menu"><div class="menu-head">Run in the background</div>
    ${WORKFLOWS.map((w, k) => `<div class="menu-item${k === 0 ? " cur" : ""}"><div class="tile">${ic(w.icon, 15)}</div>
      <div class="grow"><div class="t"><span class="mono">#${w.handle}</span></div><div class="h">${w.menu}</div></div></div>`).join("")}
    <div class="menu-item"><div class="tile">${ic("list-todo", 15)}</div><div class="grow"><div class="t"><span class="mono">#task</span></div><div class="h">Run any request in the background.</div></div></div></div>` : "";
  return `<div class="composer-wrap"><div class="composer">${items}${field}
    <div class="tools">${ic("at-sign", 15)}${ic("plus", 15)}${ic("mic", 15)}<span>Kimi K3 ${ic("chevron-down", 12)}</span></div></div></div>`;
}
const chips = `<div class="chips">
  <a class="chip" href="#home-hash">${ic("hammer")}<b>#build</b> add CSV export to reports</a>
  <a class="chip" href="#home-hash">${ic("git-pull-request")}<b>#review-pr</b> my latest pull request</a></div>`;

const SCREENS = new Map(Object.entries({
  "code-connect": () => onboarding(3, `<h1>Connect your code</h1>
    <p class="sub">We'll read your repo's setup files and suggest the tools your agent should work with. Nothing in your code changes.</p>
    <div class="hero-card">${mark("github", 40)}
      <div><div class="t" style="font-size:14px">GitHub</div><div class="d h" style="font-size:12.5px;line-height:19px;margin-top:2px">Your agent reads repos, opens pull requests, and reviews them.</div></div>
      <a class="btn" href="#code-scan">Connect GitHub</a></div>
    <p class="h fine">${ic("lock", 13)} Read-only during setup. You choose which repos it can access.</p>`,
    navRow("code-connect", "ready", "Skip for now", true)),

  "code-scan": () => onboarding(3, `<h1>Reading ${REPO}</h1>
    <p class="sub">Your most active repo. <a class="link" href="#code-scan">Pick another</a></p>
    <div class="list">
      ${[["package.json", true], ["apps/api/package.json", true], ["render.yaml", true], [".github/workflows", false]].map(([f, ok]) => `<div class="row">
        ${ok ? `<span style="display:flex;color:var(--success)">${ic("circle-check", 16)}</span>` : `<span class="spin" style="display:flex">${ic("loader-circle", 16)}</span>`}
        <span class="grow mono" style="font-size:12.5px">${f}</span>${ok ? "" : `<span class="h">Reading…</span>`}</div>`).join("")}
    </div>
    <p class="h fine">Takes a few seconds.</p>`,
    navRow("code-connect", "code-suggest", "Continue")),

  "code-suggest": () => onboarding(3, `<h1>Here's what Acme runs on</h1>
    <p class="sub">We read <span class="mono">${REPO}</span> and picked the tools your agent should reach. Connect what you want — the rest can wait.</p>
    <div class="section"><span class="label">Found in your code</span><div class="list">${serviceRow({ slug: "github", why: REPO, connected: true }, true)}${FOUND.map((s) => serviceRow(s, true)).join("")}</div></div>
    <div class="section"><span class="label">For your team</span><div class="list">${TEAM.map((s) => serviceRow(s)).join("")}</div></div>`,
    navRow("code-scan", "ready", "Continue")),

  ready: () => onboarding(4, `<div class="check-badge">${ic("check", 22, 2.6)}</div>
    <h1>Acme is ready</h1>
    <p class="sub">Two workflows to ship faster. Type <span class="mono">#</span> in any chat to run one.</p>
    <div class="list">${WORKFLOWS.map((w) => `<div class="row"><div class="tile">${ic(w.icon, 17)}</div>
      <div class="grow"><div class="handle">#${w.handle}</div><div class="d">${w.text}</div></div><span class="pill">Ready</span></div>`).join("")}</div>
    <p class="h fine" style="gap:8px">Connected ${mark("github", 20)}${mark("posthog", 20)}<span>· 5 more suggested in Plugins</span></p>`,
    navRow("code-suggest", "home", "Open workspace", false)),

  home: () => appShell(`<div class="hero"><h2>What should we build next, Sam?</h2>${chips}</div>${composer()}`),
  "home-hash": () => appShell(`<div class="hero"><h2>What should we build next, Sam?</h2></div>${composer({ typed: "#", menu: true })}`),
}));

const FLOW = ["code-connect", "code-scan", "code-suggest", "ready", "home", "home-hash"];
const TITLES = {
  "code-connect": "Connect your code", "code-scan": "Scan the repo", "code-suggest": "Suggested plugins",
  ready: "Two workflows, ready", home: "Home with starter prompts", "home-hash": "Type # to run a workflow",
};

function index() {
  return `<div class="index"><p class="eyebrow">Prototype</p><h1>Starter setup for technical founders</h1>
    <p class="sub">Connect GitHub, we read the repo, you get the right plugins and two workflows — <span class="mono">#build</span> and <span class="mono">#review-pr</span>. It replaces the plugins step of onboarding; no new steps.</p>
    <div class="list">${FLOW.map((id, k) => `<a class="row row-link" href="#${id}"><span class="num">${k + 1}</span><span class="grow t">${TITLES[id]}</span>${ic("arrow-right", 14)}</a>`).join("")}</div></div>`;
}

function render() {
  const id = location.hash.slice(1) || "index";
  document.body.classList.toggle("shot", new URLSearchParams(location.search).has("shot"));
  const root = document.getElementById("root");
  // The hash is user input: only call a screen we defined.
  const screen = SCREENS.get(id);
  const known = typeof screen === "function";
  root.innerHTML = known ? screen() : index();
  if (known) {
    root.insertAdjacentHTML("beforeend", `<nav class="protobar"><a href="#index">Overview</a>
      ${FLOW.map((s, k) => `<a href="#${s}" class="${s === id ? "cur" : ""}">${k + 1}</a>`).join("")}</nav>`);
  }
}
addEventListener("hashchange", render);
render();
</script>
</body>
</html>
