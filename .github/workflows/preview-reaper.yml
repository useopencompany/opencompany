name: Preview Reaper

# Hourly reconciler for per-PR preview stacks (issue #351 §7, Layer 3). Destroys any
# preview resource whose PR is closed, lost the `preview` label, or exceeded its TTL —
# the backstop that guarantees ephemeral infra never leaks even if a `closed` event was
# missed or a provision failed halfway. Tag-driven and idempotent; never touches prod.

on:
  schedule:
    - cron: "17 * * * *" # hourly, offset to avoid top-of-hour contention
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Log what would be reaped without deleting anything"
        type: boolean
        default: false

concurrency:
  group: preview-reaper
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write
  pull-requests: read

jobs:
  reap:
    name: Reconcile previews
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    environment: preview
    env:
      INFISICAL_ENV_SLUG: ${{ vars.PREVIEW_INFISICAL_ENV_SLUG || 'dev' }}
      INFISICAL_DOMAIN: ${{ vars.INFISICAL_DOMAIN || secrets.INFISICAL_DOMAIN || 'https://eu.infisical.com' }}
      INFISICAL_SECRET_PATH: ${{ vars.PREVIEW_INFISICAL_SECRET_PATH || '/release' }}
      PREVIEW_BASE_DOMAIN: ${{ vars.PREVIEW_BASE_DOMAIN }}
      PREVIEW_SEED_BRANCH: ${{ vars.PREVIEW_SEED_BRANCH || 'preview-seed' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.2

      - name: Fetch preview credentials from Infisical
        uses: Infisical/secrets-action@v1.0.16
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_MACHINE_IDENTITY_ID || secrets.INFISICAL_MACHINE_IDENTITY_ID }}
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG || secrets.INFISICAL_PROJECT_SLUG }}
          env-slug: ${{ env.INFISICAL_ENV_SLUG }}
          domain: ${{ env.INFISICAL_DOMAIN }}
          secret-path: ${{ env.INFISICAL_SECRET_PATH }}

      - name: Reconcile
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PREVIEW_MAX_AGE_HOURS: ${{ vars.PREVIEW_MAX_AGE_HOURS || '72' }}
          PREVIEW_DRY_RUN: ${{ inputs.dry_run }}
        run: node scripts/preview-reaper.mjs
