name: PR Preview

# Full per-PR preview stack (issue #351). GitHub Actions is the single orchestrator:
# for PRs carrying the `preview` label it provisions an isolated vertical ANTOS stack —
# Neon branch (from the sanitized preview-seed) + per-PR Render runner + Electric +
# Durable Streams + a Vercel web preview wired to all of them — and tears it all down on
# close or when the label is removed. Preview orchestration is intentionally advisory:
# failures are reported in the PR comment and deployment status when available, but must
# not block merges.
# Base/static secrets come from Infisical `dev`; the per-PR dynamic values (branch DB URL,
# runner/electric/streams URLs, tokens) are minted by scripts/preview-provision.mjs and
# injected here.
#
# The companion reconciler (every 6h) is .github/workflows/preview-reaper.yml.

on:
  pull_request:
    types: [labeled, unlabeled, synchronize, reopened, closed]

concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Infisical OIDC source for provision credentials: NEON_API_KEY, NEON_PROJECT_ID,
  # RENDER_API_KEY, RENDER_OWNER_ID, VERCEL_TOKEN/ORG_ID/PROJECT_ID. Defaults to dev +
  # /release; override with repo vars. (Machine-identity scope is a Step 7 setup item.)
  INFISICAL_ENV_SLUG: ${{ vars.PREVIEW_INFISICAL_ENV_SLUG || 'dev' }}
  INFISICAL_DOMAIN: ${{ vars.INFISICAL_DOMAIN || secrets.INFISICAL_DOMAIN || 'https://eu.infisical.com' }}
  INFISICAL_SECRET_PATH: ${{ vars.PREVIEW_INFISICAL_SECRET_PATH || '/release' }}
  PREVIEW_RUNNER_INFISICAL_ENV_SLUG: ${{ vars.PREVIEW_RUNNER_INFISICAL_ENV_SLUG || 'prod' }}
  PREVIEW_RUNNER_INFISICAL_SECRET_PATH: ${{ vars.PREVIEW_RUNNER_INFISICAL_SECRET_PATH || '/runner' }}
  PREVIEW_BASE_DOMAIN: ${{ vars.PREVIEW_BASE_DOMAIN }}
  PREVIEW_SEED_BRANCH: ${{ vars.PREVIEW_SEED_BRANCH || 'preview-seed' }}

jobs:
  # ---------------------------------------------------------------------------
  # Gate: don't provision a preview until CI (lint/typecheck/build/test) passes
  # for the PR's head SHA. Waits for the `CI` workflow's quality check to conclude.
  # ---------------------------------------------------------------------------
  await-ci:
    name: Wait for CI to pass
    if: >-
      github.event.action != 'closed' &&
      github.event.action != 'unlabeled' &&
      contains(github.event.pull_request.labels.*.name, 'preview')
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    continue-on-error: true
    permissions:
      checks: read
      contents: read
      pull-requests: write
    outputs:
      passed: ${{ steps.wait.outputs.passed }}
    steps:
      - name: Post preview queued comment
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const marker = "<!-- pr-preview -->";
            const sha = process.env.PR_SHA.slice(0, 7);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              marker,
              "### 🔄 Preview environment starting…",
              "",
              `Waiting for CI to pass before provisioning the isolated preview stack for commit \`${sha}\`.`,
              "",
              `[Workflow run](${runUrl})`,
              "",
              "_This comment updates with the preview link as soon as the alias is ready._",
            ].join("\n");
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.PR_NUMBER),
              per_page: 100,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: Number(process.env.PR_NUMBER), body });
            }

      - name: Wait for CI quality check
        id: wait
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          PR_SHA: ${{ github.event.pull_request.head.sha }}
          # The check-run name == the CI quality job's `name:` (.github/workflows/ci.yml).
          CI_CHECK_NAME: "Lint, typecheck, build, and test"
        with:
          script: |
            const sha = process.env.PR_SHA;
            const checkName = process.env.CI_CHECK_NAME;
            const deadline = Date.now() + 28 * 60 * 1000;
            const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
            while (Date.now() < deadline) {
              const { data } = await github.rest.checks.listForRef({
                owner: context.repo.owner, repo: context.repo.repo, ref: sha, per_page: 100,
              });
              const runs = data.check_runs
                .filter((c) => c.name === checkName)
                .sort((a, b) => new Date(b.started_at || 0) - new Date(a.started_at || 0));
              const run = runs[0];
              if (run && run.status === "completed") {
                if (run.conclusion === "success") {
                  core.info(`CI "${checkName}" passed for ${sha.slice(0, 7)}.`);
                  core.setOutput("passed", "true");
                  return;
                }
                core.warning(`CI "${checkName}" concluded "${run.conclusion}" — skipping preview.`);
                core.setOutput("passed", "false");
                return;
              }
              core.info(run ? `CI status: ${run.status}…` : "CI check not reported yet, waiting…");
              await sleep(20000);
            }
            core.warning(`Timed out waiting for CI "${checkName}" on ${sha.slice(0, 7)} — skipping preview.`);
            core.setOutput("passed", "false");

  # ---------------------------------------------------------------------------
  # Provision / update the full preview stack for a labeled, open PR.
  # ---------------------------------------------------------------------------
  deploy:
    name: Provision preview stack
    needs: await-ci
    if: >-
      github.event.action != 'closed' &&
      github.event.action != 'unlabeled' &&
      contains(github.event.pull_request.labels.*.name, 'preview') &&
      needs.await-ci.outputs.passed == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    continue-on-error: true
    environment: preview
    permissions:
      contents: read
      deployments: write
      id-token: write
      pull-requests: write
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_SHA: ${{ github.event.pull_request.head.sha }}
      PR_BRANCH: ${{ github.event.pull_request.head.ref }}
    steps:
      - name: Guard against fork PRs
        if: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          echo "::error::PR previews are only supported for branches in this repository (not forks)."
          exit 1

      - name: Require preview base domain
        run: |
          if [ -z "$PREVIEW_BASE_DOMAIN" ]; then
            echo "::error::PREVIEW_BASE_DOMAIN repo variable is not set (e.g. preview.opencompany.cloud)."
            exit 1
          fi

      - name: Checkout PR head
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ env.PR_SHA }}
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Fetch preview credentials from Infisical
        uses: Infisical/secrets-action@77ab1f4ccd183a543cb5b42435fbd181189f4995 # v1.0.16
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_MACHINE_IDENTITY_ID || secrets.INFISICAL_MACHINE_IDENTITY_ID }}
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG || secrets.INFISICAL_PROJECT_SLUG }}
          env-slug: ${{ env.INFISICAL_ENV_SLUG }}
          domain: ${{ env.INFISICAL_DOMAIN }}
          secret-path: ${{ env.INFISICAL_SECRET_PATH }}

      - name: Fetch preview runner runtime secrets from Infisical
        uses: Infisical/secrets-action@77ab1f4ccd183a543cb5b42435fbd181189f4995 # v1.0.16
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_MACHINE_IDENTITY_ID || secrets.INFISICAL_MACHINE_IDENTITY_ID }}
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG || secrets.INFISICAL_PROJECT_SLUG }}
          env-slug: ${{ env.PREVIEW_RUNNER_INFISICAL_ENV_SLUG }}
          domain: ${{ env.INFISICAL_DOMAIN }}
          secret-path: ${{ env.PREVIEW_RUNNER_INFISICAL_SECRET_PATH }}

      - name: Provision preview stack (Neon + migrate + Render)
        id: provision
        env:
          PREVIEW_PR_NUMBER: ${{ env.PR_NUMBER }}
          PREVIEW_SHA: ${{ env.PR_SHA }}
          PREVIEW_PR_BRANCH: ${{ env.PR_BRANCH }}
          # Reset-on-synchronize: re-fork the branch from the seed on every new commit so
          # the preview DB is deterministic for the SHA's migrations.
          PREVIEW_RESET: ${{ github.event.action == 'synchronize' }}
          NEON_BRANCH_TTL_HOURS: ${{ vars.PREVIEW_NEON_TTL_HOURS || '24' }}
          ELECTRIC_STORAGE_DIR: ${{ vars.PREVIEW_ELECTRIC_STORAGE_DIR }}
          RENDER_REGION: ${{ vars.PREVIEW_RENDER_REGION || 'frankfurt' }}
          RENDER_PLAN: ${{ vars.PREVIEW_RENDER_PLAN || 'starter' }}
        run: node scripts/preview-provision.mjs

      - name: Record GitHub deployment (manifest)
        id: github-deployment
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          MANIFEST: ${{ steps.provision.outputs.manifest }}
          ALIAS: ${{ steps.provision.outputs.alias }}
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            let payload = {};
            try { payload = JSON.parse(process.env.MANIFEST || "{}"); } catch {}
            const { data: deployment } = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: process.env.PR_SHA,
              environment: `preview/pr-${process.env.PR_NUMBER}`,
              auto_merge: false,
              required_contexts: [],
              transient_environment: true,
              production_environment: false,
              payload, // the preview manifest — source of truth for teardown/audit
              description: `Preview stack for PR #${process.env.PR_NUMBER}`,
            });
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deployment.id,
              state: "in_progress",
              log_url: runUrl,
              environment: `preview/pr-${process.env.PR_NUMBER}`,
              description: "Deploying web preview…",
            });
            core.setOutput("deployment_id", String(deployment.id));

      - name: Deploy web preview to Vercel
        id: deploy-web
        env:
          WEB_ENV: ${{ steps.provision.outputs.web_env }}
        run: |
          bunx vercel pull --yes --environment=preview --token="$VERCEL_TOKEN" --scope="$VERCEL_ORG_ID"
          # Per-PR dynamic env passed at deploy time as both runtime (-e) and build (-b)
          # vars so NEXT_PUBLIC_* are inlined and server vars are present at runtime,
          # without mutating the shared Vercel Preview env.
          flags=()
          while IFS= read -r -d "" arg; do flags+=("$arg"); done < <(node -e '
            const e = JSON.parse(process.env.WEB_ENV || "{}");
            for (const [k, v] of Object.entries(e)) {
              for (const arg of ["-e", `${k}=${String(v)}`, "-b", `${k}=${String(v)}`]) {
                process.stdout.write(`${arg}\0`);
              }
            }
          ')
          output="$(bunx vercel deploy --token="$VERCEL_TOKEN" --scope="$VERCEL_ORG_ID" "${flags[@]}")"
          echo "$output"
          url="$(printf "%s\n" "$output" | grep -Eo 'https://[^[:space:]]+' | tail -n 1)"
          if [ -z "$url" ]; then echo "::error::No Vercel deployment URL."; exit 1; fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Assign deterministic alias
        run: |
          bunx vercel alias set "${{ steps.deploy-web.outputs.url }}" "${{ steps.provision.outputs.alias }}" --token="$VERCEL_TOKEN" --scope="$VERCEL_ORG_ID"

      - name: Post preview URL (early)
        if: ${{ steps.provision.outputs.alias != '' }}
        # Surface the URL the moment the alias resolves, before the health smoke wait.
        # The final "Upsert PR comment" step updates this same comment to ready/failed.
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          PREVIEW_URL: https://${{ steps.provision.outputs.alias }}
        with:
          script: |
            const marker = "<!-- pr-preview -->";
            const body = [
              marker,
              "### 🔄 Preview environment deploying…",
              "",
              `**Preview:** ${process.env.PREVIEW_URL}`,
              "",
              "_Verifying health — this comment updates when it's ready._",
            ].join("\n");
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.PR_NUMBER),
              per_page: 100,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: Number(process.env.PR_NUMBER), body });
            }

      - name: Smoke check web + runner health
        env:
          WEB_URL: https://${{ steps.provision.outputs.alias }}
          # Vercel Deployment Protection blocks plain CI fetches, and `vercel curl`
          # requires a token scoped to the project team. The deploy + alias steps above
          # already verify the web deployment; keep smoke focused on the per-PR runner
          # until a team-scoped Vercel curl token or bypass token is configured.
          SMOKE_WEB: "false"
          RUNNER_PUBLIC_URL: ${{ steps.provision.outputs.runner_url }}
          EXPECTED_RELEASE: ${{ env.PR_SHA }}
          SMOKE_WEB_ATTEMPTS: "18"
          SMOKE_RUNNER_ATTEMPTS: "18"
          SMOKE_DELAY_MS: "10000"
        run: bun run release:smoke

      - name: Upsert PR comment
        if: ${{ always() }}
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          PREVIEW_ALIAS: ${{ steps.provision.outputs.alias }}
          RUNNER_URL: ${{ steps.provision.outputs.runner_url }}
          ELECTRIC_URL: ${{ steps.provision.outputs.electric_url }}
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const marker = "<!-- pr-preview -->";
            const ok = process.env.JOB_STATUS === "success";
            const sha = process.env.PR_SHA.slice(0, 7);
            const previewUrl = process.env.PREVIEW_ALIAS ? `https://${process.env.PREVIEW_ALIAS}` : "";
            const failureMessage = previewUrl
              ? `Provision/deploy failed — see the [workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}).`
              : `Provision/deploy failed before a preview alias was assigned — see the [workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}).`;
            const body = [
              marker,
              `### 🚀 Preview environment ${ok ? "ready" : "failed"}`,
              "",
              ok ? `**Preview:** ${previewUrl}` : failureMessage,
              "",
              ok ? `<details><summary>Stack</summary>\n\n- Runner: ${process.env.RUNNER_URL}\n- Electric: ${process.env.ELECTRIC_URL}\n- Commit: \`${sha}\`\n\n</details>` : "",
              "",
              "> Isolated per-PR stack (own Neon branch + runner + Electric + Durable Streams). The DB is **reset from the sanitized seed on every push**. Auto-expires ~24h after the last push (Neon TTL + the reaper, every 6h); removing the `preview` label or closing the PR tears it down immediately.",
            ].join("\n");
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.PR_NUMBER),
              per_page: 100,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: Number(process.env.PR_NUMBER), body });
            }

      - name: Finalize GitHub deployment
        if: ${{ always() && steps.github-deployment.outputs.deployment_id != '' }}
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          DEPLOYMENT_ID: ${{ steps.github-deployment.outputs.deployment_id }}
          PREVIEW_URL: https://${{ steps.provision.outputs.alias }}
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const ok = process.env.JOB_STATUS === "success";
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: Number(process.env.DEPLOYMENT_ID),
              state: ok ? "success" : "failure",
              log_url: runUrl,
              environment_url: ok ? process.env.PREVIEW_URL : undefined,
              environment: `preview/pr-${process.env.PR_NUMBER}`,
              description: ok ? `Preview for PR #${process.env.PR_NUMBER} is live.` : `Preview for PR #${process.env.PR_NUMBER} failed.`,
            });

  # ---------------------------------------------------------------------------
  # Tear down the preview when the PR closes or loses the `preview` label.
  # ---------------------------------------------------------------------------
  teardown:
    name: Tear down preview stack
    if: >-
      github.event.action == 'closed' ||
      (github.event.action == 'unlabeled' && github.event.label.name == 'preview')
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    environment: preview
    permissions:
      contents: read
      deployments: write # mark the preview GitHub Deployment inactive on teardown
      id-token: write
      pull-requests: write
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.2

      - name: Fetch preview credentials from Infisical
        uses: Infisical/secrets-action@77ab1f4ccd183a543cb5b42435fbd181189f4995 # v1.0.16
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_MACHINE_IDENTITY_ID || secrets.INFISICAL_MACHINE_IDENTITY_ID }}
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG || secrets.INFISICAL_PROJECT_SLUG }}
          env-slug: ${{ env.INFISICAL_ENV_SLUG }}
          domain: ${{ env.INFISICAL_DOMAIN }}
          secret-path: ${{ env.INFISICAL_SECRET_PATH }}

      - name: Tear down preview stack
        env:
          PREVIEW_PR_NUMBER: ${{ env.PR_NUMBER }}
        run: node scripts/preview-teardown.mjs

      - name: Mark deployment inactive + update comment
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const { owner, repo } = context.repo;
            // Mark the GitHub Deployment inactive so the Environments view + audit trail
            // don't keep showing a live deployment after the stack is gone.
            const environment = `preview/pr-${process.env.PR_NUMBER}`;
            const deployments = await github.paginate(github.rest.repos.listDeployments, {
              owner,
              repo,
              environment,
              per_page: 100,
            });
            for (const deployment of deployments) {
              await github.rest.repos.createDeploymentStatus({
                owner,
                repo,
                deployment_id: deployment.id,
                state: "inactive",
                description: "Preview environment torn down",
              });
            }

            const marker = "<!-- pr-preview -->";
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: Number(process.env.PR_NUMBER),
              per_page: 100,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id,
                body: `${marker}\n### 🧹 Preview environment torn down\n\nThe isolated stack for PR #${process.env.PR_NUMBER} has been removed.`,
              });
            }
