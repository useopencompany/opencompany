name: Verify

on:
  workflow_call:
    inputs:
      base_sha:
        description: Full Git SHA used as the Turbo comparison base.
        required: true
        type: string
      head_sha:
        description: Full Git SHA used as the Turbo comparison head.
        required: true
        type: string
      requested_scope:
        description: Requested verification scope (affected or full).
        required: false
        default: affected
        type: string
      cache_write:
        description: Allow a trusted main run to seed CI caches.
        required: false
        default: false
        type: boolean

# This workflow executes repository code and is called by untrusted pull requests.
# It must remain credential-free. Cache writes are additionally restricted to a
# trusted main event in every save step, even if a caller supplies a bad input.
permissions:
  contents: read

env:
  CI: true
  DO_NOT_TRACK: "1"
  TURBO_TELEMETRY_DISABLED: "1"
  TURBO_SCM_BASE: ${{ inputs.base_sha }}
  TURBO_SCM_HEAD: ${{ inputs.head_sha }}
  DATABASE_URL: postgresql://user:password@localhost:5432/opencompany_ci
  WORKOS_CLIENT_ID: client_ci
  WORKOS_API_KEY: sk_test_ci_placeholder
  WORKOS_COOKIE_PASSWORD: replace-with-at-least-32-characters
  OPENCOMPANY_NEXT_PUBLIC_APP_URL: http://localhost:3002
  OPENCOMPANY_NEXT_PUBLIC_WORKOS_REDIRECT_URI: http://localhost:3002/auth/callback

jobs:
  scope:
    name: Resolve CI scope
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 5
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
    steps:
      - name: Checkout verification commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve affected or full verification
        id: scope
        run: >-
          node scripts/ci-scope.mjs
          --base "$TURBO_SCM_BASE"
          --head "$TURBO_SCM_HEAD"
          --requested-scope "${{ inputs.requested_scope }}"

  policy:
    name: Policy
    needs: scope
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - name: Checkout verification commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.2

      - name: Restore policy caches
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .turbo
            ~/.bun/install/cache
          key: verify-policy-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ inputs.head_sha }}
          restore-keys: |
            verify-policy-${{ runner.os }}-${{ hashFiles('bun.lock') }}-
            verify-policy-${{ runner.os }}-

      - name: Install dependencies from the lockfile
        run: bun install --frozen-lockfile

      - name: Require a migration for schema changes
        env:
          BASE_SHA: ${{ inputs.base_sha }}
          HEAD_SHA: ${{ inputs.head_sha }}
        run: node scripts/check-schema-migration.mjs

      - name: Check migration journal
        run: bun run db:migrations:check

      - name: Check setup script syntax
        run: node --check scripts/setup.mjs

      - name: Check formatting
        run: bun run format:check

      - name: Check application boundaries
        run: bun run boundary:check

      - name: Check OpenAPI drift
        run: bun --filter @opencompany/protocol openapi:check

      - name: Test orchestration and workflow policy
        run: node --test scripts/lib/*.test.mjs

      - name: Save trusted policy caches
        if: ${{ success() && inputs.cache_write && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .turbo
            ~/.bun/install/cache
          key: verify-policy-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ inputs.head_sha }}

  static:
    name: Static
    needs: scope
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - name: Checkout verification commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.2

      - name: Restore static caches
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .turbo
            ~/.bun/install/cache
          key: verify-static-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ inputs.head_sha }}
          restore-keys: |
            verify-static-${{ runner.os }}-${{ hashFiles('bun.lock') }}-
            verify-static-${{ runner.os }}-

      - name: Install dependencies from the lockfile
        run: bun install --frozen-lockfile

      - name: Lint and typecheck
        env:
          RESOLVED_SCOPE: ${{ needs.scope.outputs.scope }}
        run: |
          scope_args=()
          if [[ "$RESOLVED_SCOPE" == "affected" ]]; then scope_args+=(--affected); fi
          bun --bun turbo run lint typecheck --concurrency=2 "${scope_args[@]}"

      - name: Save trusted static caches
        if: ${{ success() && inputs.cache_write && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .turbo
            ~/.bun/install/cache
          key: verify-static-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ inputs.head_sha }}

  test:
    name: Test
    needs: scope
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - name: Checkout verification commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.2

      - name: Restore test caches
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .turbo
            ~/.bun/install/cache
          key: verify-test-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ inputs.head_sha }}
          restore-keys: |
            verify-test-${{ runner.os }}-${{ hashFiles('bun.lock') }}-
            verify-test-${{ runner.os }}-

      - name: Install dependencies from the lockfile
        run: bun install --frozen-lockfile

      - name: Test packages with bounded workers
        env:
          RESOLVED_SCOPE: ${{ needs.scope.outputs.scope }}
        run: |
          scope_args=()
          if [[ "$RESOLVED_SCOPE" == "affected" ]]; then scope_args+=(--affected); fi
          # Vitest's PGlite suite uses WASM that intermittently traps in Bun-backed fork workers.
          # Keep Bun as the package manager, but let Vitest workers inherit the supported Node runtime.
          bun turbo run test --concurrency=2 "${scope_args[@]}" -- --maxWorkers=2

      - name: Save trusted test caches
        if: ${{ success() && inputs.cache_write && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .turbo
            ~/.bun/install/cache
          key: verify-test-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ inputs.head_sha }}

  build:
    name: Build
    needs: scope
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - name: Checkout verification commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.2

      - name: Restore build caches
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .turbo
            ~/.bun/install/cache
          key: verify-build-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ inputs.head_sha }}
          restore-keys: |
            verify-build-${{ runner.os }}-${{ hashFiles('bun.lock') }}-
            verify-build-${{ runner.os }}-

      - name: Install dependencies from the lockfile
        run: bun install --frozen-lockfile

      - name: Build packages
        env:
          RESOLVED_SCOPE: ${{ needs.scope.outputs.scope }}
        run: |
          scope_args=()
          if [[ "$RESOLVED_SCOPE" == "affected" ]]; then scope_args+=(--affected); fi
          bun --bun turbo run build --concurrency=2 "${scope_args[@]}"

      - name: Smoke test document extraction in the runner image
        run: |
          if git diff --quiet "$TURBO_SCM_BASE" "$TURBO_SCM_HEAD" -- Dockerfile.runner packages/file-extract; then
            echo "Runner image document extraction is unaffected."
            exit 0
          fi

          image="opencompany-runner-verify:${TURBO_SCM_HEAD}"
          docker build --file Dockerfile.runner --tag "$image" .
          docker run --rm --entrypoint bun "$image" -e '
            import { readFileSync } from "node:fs";
            import { extractDocumentMarkdown } from "./packages/file-extract/src/index.ts";

            const bytes = readFileSync("packages/file-extract/src/fixtures/sample.pptx");
            const result = await extractDocumentMarkdown({ bytes, filename: "sample.pptx" });
            if (result.format !== "pptx" || result.markdown.trim().length === 0) {
              throw new Error("Runner image document extraction smoke test returned no content.");
            }
            console.log("Runner image document extraction smoke test passed.");
          '

      - name: Save trusted build caches
        if: ${{ success() && inputs.cache_write && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .turbo
            ~/.bun/install/cache
          key: verify-build-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ inputs.head_sha }}

  secrets:
    name: Secret scan
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - name: Checkout verification commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan the exact commit range for secrets
        uses: trufflesecurity/trufflehog@20652fbbdefffcdaa493a5bf57ab2ac6b1db715b # v3.97.1
        with:
          base: ${{ inputs.base_sha }}
          head: ${{ inputs.head_sha }}
          extra_args: --results=verified,unknown
