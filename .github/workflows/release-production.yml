name: Release Production

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_api:
        description: Deploy the Render product API
        type: boolean
        default: true
      deploy_runner:
        description: Deploy the Render runner
        type: boolean
        default: true

concurrency:
  group: production-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  context:
    name: Resolve release context
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 5
    outputs:
      base_sha: ${{ steps.base.outputs.base_sha }}
    env:
      RELEASE_SHA: ${{ github.sha }}
    steps:
      - name: Require manual releases to run from main
        if: ${{ github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' }}
        run: |
          echo "::error::Production releases must run from main. Current ref: $GITHUB_REF"
          exit 1

      - name: Checkout release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 2
          persist-credentials: false

      - name: Resolve verification base
        id: base
        env:
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          base_sha="$EVENT_BEFORE"
          if [[ ! "$base_sha" =~ ^[a-f0-9]{40}$ || "$base_sha" == "0000000000000000000000000000000000000000" ]]; then
            base_sha="$(git rev-parse "$RELEASE_SHA^" 2>/dev/null || printf '%s' "$RELEASE_SHA")"
          fi
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"

  verify:
    name: Verify main
    needs: context
    permissions:
      contents: read
    uses: ./.github/workflows/verify.yml
    with:
      base_sha: ${{ needs.context.outputs.base_sha }}
      head_sha: ${{ github.sha }}
      requested_scope: affected
      cache_write: true

  plan:
    name: Plan production release
    needs: verify
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    permissions:
      contents: read
      deployments: read
    outputs:
      any: ${{ steps.plan.outputs.any }}
      database: ${{ steps.plan.outputs.database }}
      api: ${{ steps.plan.outputs.api }}
      runner: ${{ steps.plan.outputs.runner }}
      web: ${{ steps.plan.outputs.web }}
      marketing: ${{ steps.plan.outputs.marketing }}
    env:
      RELEASE_SHA: ${{ github.sha }}
    steps:
      - name: Checkout verified main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.2

      - name: Install dependencies from the lockfile
        run: bun install --frozen-lockfile

      - name: Calculate per-surface release scope
        id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEPLOY_API_INPUT: ${{ inputs.deploy_api }}
          DEPLOY_RUNNER_INPUT: ${{ inputs.deploy_runner }}
        run: |
          args=()
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            args+=(--all)
            if [[ "$DEPLOY_API_INPUT" != "true" ]]; then args+=(--skip-api); fi
            if [[ "$DEPLOY_RUNNER_INPUT" != "true" ]]; then args+=(--skip-runner); fi
          fi
          node scripts/release-plan.mjs "${args[@]}"

  release:
    name: Deploy production surfaces
    needs: plan
    if: ${{ needs.plan.outputs.any == 'true' }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 45
    environment: production
    permissions:
      contents: read
      deployments: write
      id-token: write
    env:
      RELEASE_SHA: ${{ github.sha }}
      GITHUB_TOKEN: ${{ github.token }}
      INFISICAL_ENV_SLUG: ${{ vars.INFISICAL_ENV_SLUG || secrets.INFISICAL_ENV_SLUG || 'prod' }}
      INFISICAL_DOMAIN: ${{ vars.INFISICAL_DOMAIN || secrets.INFISICAL_DOMAIN || 'https://eu.infisical.com' }}
      RENDER_DEPLOY_TIMEOUT_MS: "1200000"
      VERCEL_DEPLOY_TIMEOUT_MS: "600000"
      VERCEL_READY_TIMEOUT_MS: "600000"
    steps:
      - name: Checkout verified release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.2

      - name: Install dependencies from the lockfile
        run: bun install --frozen-lockfile

      - name: Fetch release secrets from Infisical
        uses: Infisical/secrets-action@6cd3f7c0e4cc0d2395ee4ef414eb6eeb5d3e73db # v1.0.17
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_MACHINE_IDENTITY_ID || secrets.INFISICAL_MACHINE_IDENTITY_ID }}
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG || secrets.INFISICAL_PROJECT_SLUG }}
          env-slug: ${{ env.INFISICAL_ENV_SLUG }}
          domain: ${{ env.INFISICAL_DOMAIN }}
          secret-path: /release

      - name: Check release automation env
        run: bun run release:preflight -- --release

      - name: Fetch API secrets from Infisical
        if: ${{ needs.plan.outputs.api == 'true' }}
        uses: Infisical/secrets-action@6cd3f7c0e4cc0d2395ee4ef414eb6eeb5d3e73db # v1.0.17
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_MACHINE_IDENTITY_ID || secrets.INFISICAL_MACHINE_IDENTITY_ID }}
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG || secrets.INFISICAL_PROJECT_SLUG }}
          env-slug: ${{ env.INFISICAL_ENV_SLUG }}
          domain: ${{ env.INFISICAL_DOMAIN }}
          secret-path: /api

      - name: Check API env
        if: ${{ needs.plan.outputs.api == 'true' }}
        run: bun run release:preflight -- --api

      - name: Fetch runner secrets from Infisical
        if: ${{ needs.plan.outputs.runner == 'true' }}
        uses: Infisical/secrets-action@6cd3f7c0e4cc0d2395ee4ef414eb6eeb5d3e73db # v1.0.17
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_MACHINE_IDENTITY_ID || secrets.INFISICAL_MACHINE_IDENTITY_ID }}
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG || secrets.INFISICAL_PROJECT_SLUG }}
          env-slug: ${{ env.INFISICAL_ENV_SLUG }}
          domain: ${{ env.INFISICAL_DOMAIN }}
          secret-path: /runner

      - name: Check runner env
        if: ${{ needs.plan.outputs.runner == 'true' }}
        run: bun run release:preflight -- --runner

      - name: Verify managed capability contracts
        if: ${{ needs.plan.outputs.api == 'true' || needs.plan.outputs.runner == 'true' }}
        run: bun run web:capabilities:contract

      - name: Map production database and web env
        run: |
          if [[ "${{ needs.plan.outputs.database }}" == "true" ]]; then
            echo "DATABASE_URL=$PRODUCTION_DATABASE_URL" >> "$GITHUB_ENV"
          fi
          if [[ "${{ needs.plan.outputs.web }}" == "true" ]]; then
            web_url="${PRODUCTION_OPENCOMPANY_URL%/}"
            if [[ -z "$web_url" ]]; then
              echo "::error::PRODUCTION_OPENCOMPANY_URL is required to deploy web."
              exit 1
            fi
            echo "OPENCOMPANY_NEXT_PUBLIC_APP_URL=$web_url" >> "$GITHUB_ENV"
            echo "OPENCOMPANY_NEXT_PUBLIC_WORKOS_REDIRECT_URI=$web_url/auth/callback" >> "$GITHUB_ENV"
          fi

      # Vercel outputs remain runner-local. They are built before migrations so
      # application build failures cannot follow a production schema change.
      - name: Prepare web deployment
        id: prepare-web
        if: ${{ needs.plan.outputs.web == 'true' }}
        run: node scripts/release-vercel-prepare.mjs --surface web

      - name: Prepare marketing deployment
        id: prepare-marketing
        if: ${{ needs.plan.outputs.marketing == 'true' }}
        run: node scripts/release-vercel-prepare.mjs --surface marketing

      - name: Confirm release is current before production changes
        id: current-before-migration
        run: node scripts/check-release-current.mjs

      - name: Create database deployment
        id: deployment-database
        if: ${{ steps.current-before-migration.outputs.should_release == 'true' && needs.plan.outputs.database == 'true' }}
        continue-on-error: true
        run: node scripts/release-deployment.mjs create --surface database

      - name: Create API deployment
        id: deployment-api
        if: ${{ steps.current-before-migration.outputs.should_release == 'true' && needs.plan.outputs.api == 'true' }}
        continue-on-error: true
        run: node scripts/release-deployment.mjs create --surface api

      - name: Create runner deployment
        id: deployment-runner
        if: ${{ steps.current-before-migration.outputs.should_release == 'true' && needs.plan.outputs.runner == 'true' }}
        continue-on-error: true
        run: node scripts/release-deployment.mjs create --surface runner

      - name: Create web deployment
        id: deployment-web
        if: ${{ steps.current-before-migration.outputs.should_release == 'true' && needs.plan.outputs.web == 'true' }}
        continue-on-error: true
        run: node scripts/release-deployment.mjs create --surface web

      - name: Create marketing deployment
        id: deployment-marketing
        if: ${{ steps.current-before-migration.outputs.should_release == 'true' && needs.plan.outputs.marketing == 'true' }}
        continue-on-error: true
        run: node scripts/release-deployment.mjs create --surface marketing

      - name: Run production migrations
        id: migrate
        if: ${{ steps.current-before-migration.outputs.should_release == 'true' && needs.plan.outputs.database == 'true' && steps.deployment-database.outputs.deployment_id != '' }}
        run: bun run db:migrate

      - name: Canonicalize wiki path links
        id: backfill-wiki-path-links
        if: ${{ steps.current-before-migration.outputs.should_release == 'true' && needs.plan.outputs.database == 'true' && steps.migrate.outcome == 'success' }}
        run: bun scripts/backfill-wiki-path-links.ts

      - name: Confirm release is current before provider deploys
        id: current-before-deploy
        if: ${{ always() && !cancelled() && steps.current-before-migration.outputs.should_release == 'true' }}
        run: node scripts/check-release-current.mjs

      - name: Deploy and smoke marketing
        id: deploy-marketing
        if: ${{ always() && !cancelled() && steps.current-before-deploy.outputs.should_release == 'true' && needs.plan.outputs.marketing == 'true' && steps.deployment-marketing.outputs.deployment_id != '' }}
        run: >-
          node scripts/release-vercel-deploy.mjs
          --label marketing
          --project-env MARKETING_VERCEL_PROJECT_ID
          --prepared-dir "${{ steps.prepare-marketing.outputs.prepared_dir }}"
          --smoke-path /

      - name: Deploy and smoke Render services
        id: deploy-render
        if: ${{ always() && !cancelled() && steps.current-before-deploy.outputs.should_release == 'true' && ((needs.plan.outputs.api == 'true' && steps.deployment-api.outputs.deployment_id != '') || (needs.plan.outputs.runner == 'true' && steps.deployment-runner.outputs.deployment_id != '')) && (needs.plan.outputs.database != 'true' || (steps.migrate.outcome == 'success' && steps.backfill-wiki-path-links.outcome == 'success')) }}
        run: |
          args=()
          if [[ "${{ needs.plan.outputs.api }}" == "true" && -n "${{ steps.deployment-api.outputs.deployment_id }}" ]]; then args+=(--api); fi
          if [[ "${{ needs.plan.outputs.runner }}" == "true" && -n "${{ steps.deployment-runner.outputs.deployment_id }}" ]]; then args+=(--runner); fi
          node scripts/release-render-services.mjs "${args[@]}"

      - name: Deploy web
        id: deploy-web
        if: ${{ always() && !cancelled() && steps.current-before-deploy.outputs.should_release == 'true' && needs.plan.outputs.web == 'true' && steps.deployment-web.outputs.deployment_id != '' && (needs.plan.outputs.database != 'true' || (steps.migrate.outcome == 'success' && steps.backfill-wiki-path-links.outcome == 'success')) && (needs.plan.outputs.api != 'true' || steps.deploy-render.outputs.api_result == 'success') && (needs.plan.outputs.runner != 'true' || steps.deploy-render.outputs.runner_result == 'success') }}
        run: >-
          node scripts/release-vercel-deploy.mjs
          --label web
          --project-env OPENCOMPANY_VERCEL_PROJECT_ID
          --prepared-dir "${{ steps.prepare-web.outputs.prepared_dir }}"

      - name: Smoke web release
        id: smoke-web
        if: ${{ always() && !cancelled() && steps.deploy-web.outcome == 'success' }}
        env:
          EXPECTED_WEB_RELEASE: ${{ env.RELEASE_SHA }}
          SMOKE_WEB: "true"
          SMOKE_API: "false"
          SMOKE_RUNNER: "false"
          SMOKE_WEB_VERCEL_DEPLOYMENT: ${{ steps.deploy-web.outputs.url }}
          SMOKE_WEB_ATTEMPTS: "12"
          SMOKE_DELAY_MS: "10000"
        run: bun run release:smoke

      - name: Finalize database deployment
        if: ${{ always() && steps.deployment-database.outputs.deployment_id != '' }}
        env:
          DEPLOYMENT_ID: ${{ steps.deployment-database.outputs.deployment_id }}
          MIGRATION_OUTCOME: ${{ steps.migrate.outcome }}
          BACKFILL_OUTCOME: ${{ steps.backfill-wiki-path-links.outcome }}
        run: |
          state=inactive
          if [[ "$MIGRATION_OUTCOME" == "success" && "$BACKFILL_OUTCOME" == "success" ]]; then state=success; fi
          if [[ "$MIGRATION_OUTCOME" == "failure" || "$BACKFILL_OUTCOME" == "failure" ]]; then state=failure; fi
          node scripts/release-deployment.mjs finalize --surface database --deployment-id "$DEPLOYMENT_ID" --state "$state"

      - name: Finalize API deployment
        if: ${{ always() && steps.deployment-api.outputs.deployment_id != '' }}
        env:
          DEPLOYMENT_ID: ${{ steps.deployment-api.outputs.deployment_id }}
          SURFACE_RESULT: ${{ steps.deploy-render.outputs.api_result }}
        run: |
          state=inactive
          if [[ "$SURFACE_RESULT" == "success" ]]; then state=success; fi
          if [[ "$SURFACE_RESULT" == "failure" ]]; then state=failure; fi
          node scripts/release-deployment.mjs finalize --surface api --deployment-id "$DEPLOYMENT_ID" --state "$state"

      - name: Finalize runner deployment
        if: ${{ always() && steps.deployment-runner.outputs.deployment_id != '' }}
        env:
          DEPLOYMENT_ID: ${{ steps.deployment-runner.outputs.deployment_id }}
          SURFACE_RESULT: ${{ steps.deploy-render.outputs.runner_result }}
        run: |
          state=inactive
          if [[ "$SURFACE_RESULT" == "success" ]]; then state=success; fi
          if [[ "$SURFACE_RESULT" == "failure" ]]; then state=failure; fi
          node scripts/release-deployment.mjs finalize --surface runner --deployment-id "$DEPLOYMENT_ID" --state "$state"

      - name: Finalize web deployment
        if: ${{ always() && steps.deployment-web.outputs.deployment_id != '' }}
        env:
          DEPLOYMENT_ID: ${{ steps.deployment-web.outputs.deployment_id }}
          DEPLOY_OUTCOME: ${{ steps.deploy-web.outcome }}
          SMOKE_OUTCOME: ${{ steps.smoke-web.outcome }}
          DEPLOYMENT_URL: ${{ steps.deploy-web.outputs.url }}
        run: |
          state=inactive
          if [[ "$DEPLOY_OUTCOME" == "success" ]]; then state=failure; fi
          if [[ "$SMOKE_OUTCOME" == "success" ]]; then state=success; fi
          args=(finalize --surface web --deployment-id "$DEPLOYMENT_ID" --state "$state")
          if [[ -n "$DEPLOYMENT_URL" ]]; then args+=(--environment-url "$DEPLOYMENT_URL"); fi
          node scripts/release-deployment.mjs "${args[@]}"

      - name: Finalize marketing deployment
        if: ${{ always() && steps.deployment-marketing.outputs.deployment_id != '' }}
        env:
          DEPLOYMENT_ID: ${{ steps.deployment-marketing.outputs.deployment_id }}
          DEPLOY_OUTCOME: ${{ steps.deploy-marketing.outcome }}
          DEPLOYMENT_URL: ${{ steps.deploy-marketing.outputs.url }}
        run: |
          state=inactive
          if [[ "$DEPLOY_OUTCOME" == "success" ]]; then state=success; fi
          if [[ "$DEPLOY_OUTCOME" == "failure" ]]; then state=failure; fi
          args=(finalize --surface marketing --deployment-id "$DEPLOYMENT_ID" --state "$state")
          if [[ -n "$DEPLOYMENT_URL" ]]; then args+=(--environment-url "$DEPLOYMENT_URL"); fi
          node scripts/release-deployment.mjs "${args[@]}"

      - name: Require every selected surface to succeed
        if: ${{ always() && !cancelled() && steps.current-before-migration.outputs.should_release == 'true' }}
        env:
          DATABASE_SELECTED: ${{ needs.plan.outputs.database }}
          DATABASE_DEPLOYMENT_ID: ${{ steps.deployment-database.outputs.deployment_id }}
          DATABASE_RESULT: ${{ steps.migrate.outcome }}
          API_SELECTED: ${{ needs.plan.outputs.api }}
          API_DEPLOYMENT_ID: ${{ steps.deployment-api.outputs.deployment_id }}
          API_RESULT: ${{ steps.deploy-render.outputs.api_result }}
          RUNNER_SELECTED: ${{ needs.plan.outputs.runner }}
          RUNNER_DEPLOYMENT_ID: ${{ steps.deployment-runner.outputs.deployment_id }}
          RUNNER_RESULT: ${{ steps.deploy-render.outputs.runner_result }}
          WEB_SELECTED: ${{ needs.plan.outputs.web }}
          WEB_DEPLOYMENT_ID: ${{ steps.deployment-web.outputs.deployment_id }}
          WEB_RESULT: ${{ steps.smoke-web.outcome }}
          MARKETING_SELECTED: ${{ needs.plan.outputs.marketing }}
          MARKETING_DEPLOYMENT_ID: ${{ steps.deployment-marketing.outputs.deployment_id }}
          MARKETING_RESULT: ${{ steps.deploy-marketing.outcome }}
        run: node scripts/check-release-results.mjs
