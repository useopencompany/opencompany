name: Release Production

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_runner:
        description: "Trigger the Render runner deploy after the web deploy"
        type: boolean
        default: true
      smoke:
        description: "Run web and runner health checks after deploy"
        type: boolean
        default: true

concurrency:
  group: production-release
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  release:
    name: Migrate, deploy web, deploy runner
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production
    env:
      INFISICAL_ENV_SLUG: ${{ vars.INFISICAL_ENV_SLUG || secrets.INFISICAL_ENV_SLUG || 'prod' }}
      RELEASE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_SHA }}

      - name: Require main branch
        if: ${{ github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' }}
        run: |
          echo "Production releases must run from main. Current ref: $GITHUB_REF"
          exit 1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Fetch release secrets from Infisical
        uses: Infisical/secrets-action@v1.0.9
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_MACHINE_IDENTITY_ID || secrets.INFISICAL_MACHINE_IDENTITY_ID }}
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG || secrets.INFISICAL_PROJECT_SLUG }}
          env-slug: ${{ env.INFISICAL_ENV_SLUG }}
          secret-path: /release

      - name: Check release automation env
        run: bun run release:preflight -- --release

      - name: Map production database URL
        run: echo "DATABASE_URL=$PRODUCTION_DATABASE_URL" >> "$GITHUB_ENV"

      - name: Run production migrations
        run: bun run db:migrate

      - name: Pull Vercel project config
        run: bunx vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build web
        run: bunx vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy web
        id: deploy-web
        run: |
          output="$(bunx vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")"
          echo "$output"
          url="$(printf "%s\n" "$output" | grep -Eo 'https://[^[:space:]]+' | tail -n 1)"
          if [ -z "$url" ]; then
            echo "Could not find deployment URL in Vercel output."
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed web to $url"

      - name: Trigger runner deploy
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.deploy_runner }}
        run: curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"

      - name: Smoke check release
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.smoke }}
        env:
          PRODUCTION_WEB_URL: ${{ steps.deploy-web.outputs.url }}
          EXPECTED_RELEASE: ${{ env.RELEASE_SHA }}
          SMOKE_ATTEMPTS: "60"
          SMOKE_DELAY_MS: "10000"
        run: bun run release:smoke
