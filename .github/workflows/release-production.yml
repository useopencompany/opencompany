name: Release Production

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_runner:
        description: "Trigger the Render runner deploy"
        type: boolean
        default: true
      smoke:
        description: "Run production health checks after deploy"
        type: boolean
        default: true

concurrency:
  group: production-release
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write
  id-token: write

jobs:
  release:
    name: Migrate and deploy production
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    environment: production
    env:
      INFISICAL_ENV_SLUG: ${{ vars.INFISICAL_ENV_SLUG || secrets.INFISICAL_ENV_SLUG || 'prod' }}
      INFISICAL_DOMAIN: ${{ vars.INFISICAL_DOMAIN || secrets.INFISICAL_DOMAIN || 'https://eu.infisical.com' }}
      RELEASE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0

      - name: Require main branch
        if: ${{ github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' }}
        run: |
          echo "Production releases must run from main. Current ref: $GITHUB_REF"
          exit 1

      - name: Check automatic release is still current
        id: current-release
        if: ${{ github.event_name == 'workflow_run' }}
        run: |
          git fetch --no-tags --depth=1 origin main
          latest_sha="$(git rev-parse refs/remotes/origin/main)"
          if [ "$RELEASE_SHA" != "$latest_sha" ]; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "Skipping release for $RELEASE_SHA because origin/main is now $latest_sha."
            exit 0
          fi
          echo "should_release=true" >> "$GITHUB_OUTPUT"
          echo "Release $RELEASE_SHA is current."

      - name: Skip stale automatic release
        if: ${{ github.event_name == 'workflow_run' && steps.current-release.outputs.should_release == 'false' }}
        run: echo "This automatic release was superseded before setup, so no deployment work will run."

      - name: Resolve previous successful production release
        id: release-base
        if: ${{ github.event_name == 'workflow_run' && steps.current-release.outputs.should_release == 'true' }}
        uses: actions/github-script@v7
        with:
          script: |
            try {
              const { data: deployments } = await github.rest.repos.listDeployments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                environment: "production",
                per_page: 100,
              });

              for (const deployment of deployments) {
                if (
                  deployment.sha === process.env.RELEASE_SHA ||
                  !/^[a-f0-9]{40}$/i.test(deployment.sha) ||
                  !deployment.description?.startsWith("Production release ")
                ) {
                  continue;
                }

                const { data: statuses } = await github.rest.repos.listDeploymentStatuses({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  deployment_id: deployment.id,
                  per_page: 100,
                });

                if (statuses.some((status) => status.state === "success")) {
                  core.setOutput("base_sha", deployment.sha);
                  core.info(`Using production release ${deployment.sha.slice(0, 7)} as the scope base.`);
                  return;
                }
              }

              core.warning("No previous successful production release was found; every surface will deploy.");
              core.setOutput("base_sha", "");
            } catch (error) {
              const message = error instanceof Error ? error.message : String(error);
              core.warning(`Could not resolve the previous production release: ${message}`);
              core.setOutput("base_sha", "");
            }

      - name: Setup Bun
        if: ${{ github.event_name == 'workflow_dispatch' || steps.current-release.outputs.should_release == 'true' }}
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.2

      - name: Install dependencies
        if: ${{ github.event_name == 'workflow_dispatch' || steps.current-release.outputs.should_release == 'true' }}
        run: bun install --frozen-lockfile

      - name: Plan production release scope
        id: release-scope
        if: ${{ github.event_name == 'workflow_dispatch' || steps.current-release.outputs.should_release == 'true' }}
        env:
          RELEASE_BASE_SHA: ${{ steps.release-base.outputs.base_sha }}
          DEPLOY_RUNNER_INPUT: ${{ inputs.deploy_runner }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$DEPLOY_RUNNER_INPUT" == "true" ]]; then
              bun run release:scope -- --all
            else
              bun run release:scope -- --all --skip-runner
            fi
          elif [[ -n "$RELEASE_BASE_SHA" ]]; then
            bun run release:scope -- --base "$RELEASE_BASE_SHA" --head "$RELEASE_SHA"
          else
            bun run release:scope -- --all
          fi

      - name: Fetch release secrets from Infisical
        if: ${{ github.event_name == 'workflow_dispatch' || steps.current-release.outputs.should_release == 'true' }}
        uses: Infisical/secrets-action@v1.0.16
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_MACHINE_IDENTITY_ID || secrets.INFISICAL_MACHINE_IDENTITY_ID }}
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG || secrets.INFISICAL_PROJECT_SLUG }}
          env-slug: ${{ env.INFISICAL_ENV_SLUG }}
          domain: ${{ env.INFISICAL_DOMAIN }}
          secret-path: /release

      - name: Check release automation env
        if: ${{ github.event_name == 'workflow_dispatch' || steps.current-release.outputs.should_release == 'true' }}
        run: bun run release:preflight -- --release

      - name: Re-check automatic release before production changes
        id: production-release
        if: ${{ github.event_name == 'workflow_run' && steps.current-release.outputs.should_release == 'true' }}
        run: |
          git fetch --no-tags --depth=1 origin main
          latest_sha="$(git rev-parse refs/remotes/origin/main)"
          if [ "$RELEASE_SHA" != "$latest_sha" ]; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "Skipping production changes for $RELEASE_SHA because origin/main is now $latest_sha."
            exit 0
          fi
          echo "should_release=true" >> "$GITHUB_OUTPUT"
          echo "Release $RELEASE_SHA is still current before production changes."

      - name: Skip stale production changes
        if: ${{ github.event_name == 'workflow_run' && steps.production-release.outputs.should_release == 'false' }}
        run: echo "This automatic release was superseded before migrations/deploy, so production was not changed."

      - name: Check Goat billing env before production changes
        if: ${{ (github.event_name == 'workflow_dispatch' || steps.production-release.outputs.should_release == 'true') && steps.release-scope.outputs.goat == 'true' }}
        run: node scripts/check-goat-billing-production-env.mjs

      - name: Create GitHub deployment
        id: github-deployment
        if: ${{ github.event_name == 'workflow_dispatch' || steps.production-release.outputs.should_release == 'true' }}
        uses: actions/github-script@v7
        with:
          script: |
            const releaseSha = process.env.RELEASE_SHA;
            const shortSha = releaseSha.slice(0, 7);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const { data: deployment } = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: releaseSha,
              environment: "production",
              auto_merge: false,
              required_contexts: [],
              transient_environment: false,
              production_environment: true,
              description: `Production release ${shortSha}`,
            });

            const status = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deployment.id,
              state: "in_progress",
              log_url: runUrl,
              environment: "production",
              description: `Production release ${shortSha} is in progress.`,
            };

            if (process.env.PRODUCTION_WEB_URL) {
              status.environment_url = process.env.PRODUCTION_WEB_URL;
            }

            await github.rest.repos.createDeploymentStatus(status);
            core.setOutput("deployment_id", String(deployment.id));

      - name: Map production database URL
        if: ${{ github.event_name == 'workflow_dispatch' || steps.production-release.outputs.should_release == 'true' }}
        run: echo "DATABASE_URL=$PRODUCTION_DATABASE_URL" >> "$GITHUB_ENV"

      - name: Run production migrations
        if: ${{ github.event_name == 'workflow_dispatch' || steps.production-release.outputs.should_release == 'true' }}
        run: bun run db:migrate

      - name: Pull Vercel project config
        if: ${{ (github.event_name == 'workflow_dispatch' || steps.production-release.outputs.should_release == 'true') && steps.release-scope.outputs.web == 'true' }}
        run: bunx vercel pull --yes --environment=production --token="$VERCEL_TOKEN" --scope="$VERCEL_ORG_ID" --project="$VERCEL_PROJECT_ID"

      - name: Check Vercel web env
        if: ${{ (github.event_name == 'workflow_dispatch' || steps.production-release.outputs.should_release == 'true') && steps.release-scope.outputs.web == 'true' }}
        env:
          OPENCOMPANY_LOAD_VERCEL_ENV: "1"
        run: bun run release:preflight -- --web

      - name: Build web
        if: ${{ (github.event_name == 'workflow_dispatch' || steps.production-release.outputs.should_release == 'true') && steps.release-scope.outputs.web == 'true' }}
        env:
          OBSERVABILITY_RELEASE: ${{ env.RELEASE_SHA }}
          NEXT_PUBLIC_OBSERVABILITY_RELEASE: ${{ env.RELEASE_SHA }}
        run: bunx vercel build --prod --token="$VERCEL_TOKEN" --scope="$VERCEL_ORG_ID" --project="$VERCEL_PROJECT_ID"

      - name: Re-check automatic release before deploy
        id: deploy-release
        if: ${{ github.event_name == 'workflow_run' && steps.production-release.outputs.should_release == 'true' }}
        run: |
          git fetch --no-tags --depth=1 origin main
          latest_sha="$(git rev-parse refs/remotes/origin/main)"
          if [ "$RELEASE_SHA" != "$latest_sha" ]; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "Skipping deploy for $RELEASE_SHA because origin/main is now $latest_sha."
            exit 0
          fi
          echo "should_release=true" >> "$GITHUB_OUTPUT"
          echo "Release $RELEASE_SHA is still current before deploy."

      - name: Skip stale deploy
        if: ${{ github.event_name == 'workflow_run' && steps.deploy-release.outputs.should_release == 'false' }}
        run: echo "This automatic release was superseded after build, so the planned production deploys were skipped."

      - name: Trigger runner deploy
        id: trigger-runner
        if: ${{ (github.event_name == 'workflow_dispatch' || steps.deploy-release.outputs.should_release == 'true') && steps.release-scope.outputs.runner == 'true' }}
        run: bun run release:render -- --trigger-only

      - name: Deploy web
        id: deploy-web
        if: ${{ (github.event_name == 'workflow_dispatch' || steps.deploy-release.outputs.should_release == 'true') && steps.release-scope.outputs.web == 'true' }}
        run: node scripts/release-vercel-deploy.mjs --label web

      - name: Map Goat production app env
        if: ${{ (github.event_name == 'workflow_dispatch' || steps.deploy-release.outputs.should_release == 'true') && steps.release-scope.outputs.goat == 'true' }}
        run: |
          goat_url="${PRODUCTION_GOAT_URL%/}"
          if [ -z "$goat_url" ]; then
            echo "PRODUCTION_GOAT_URL is required to deploy Goat."
            exit 1
          fi

          {
            echo "GOAT_NEXT_PUBLIC_APP_URL=$goat_url"
            echo "GOAT_NEXT_PUBLIC_WORKOS_REDIRECT_URI=$goat_url/auth/callback"
          } >> "$GITHUB_ENV"

      - name: Check Vercel Goat project config
        if: ${{ (github.event_name == 'workflow_dispatch' || steps.deploy-release.outputs.should_release == 'true') && steps.release-scope.outputs.goat == 'true' }}
        run: |
          rm -rf .vercel

          node <<'NODE'
          const { mkdirSync, writeFileSync } = require("node:fs");

          async function main() {
            const projectId = process.env.GOAT_VERCEL_PROJECT_ID;
            const teamId = process.env.VERCEL_ORG_ID;
            const token = process.env.VERCEL_TOKEN;

            if (!projectId || !teamId || !token) {
              throw new Error("GOAT_VERCEL_PROJECT_ID, VERCEL_ORG_ID, and VERCEL_TOKEN are required.");
            }

            const response = await fetch(
              `https://api.vercel.com/v9/projects/${projectId}?teamId=${teamId}`,
              { headers: { Authorization: `Bearer ${token}` } },
            );

            if (!response.ok) {
              throw new Error(`Could not fetch Goat Vercel project metadata: ${response.status} ${response.statusText}`);
            }

            const project = await response.json();

            if (project.id !== projectId) {
              throw new Error("Fetched Vercel project id does not match GOAT_VERCEL_PROJECT_ID.");
            }

            if (project.rootDirectory !== "apps/goat") {
              throw new Error(`Goat Vercel project rootDirectory must be apps/goat, got ${project.rootDirectory ?? "<unset>"}.`);
            }

            const minimumSkewProtectionMaxAge = 7 * 24 * 60 * 60;
            if ((project.skewProtectionMaxAge ?? 0) < minimumSkewProtectionMaxAge) {
              throw new Error(
                `Goat Vercel Skew Protection maximum age must be at least ${minimumSkewProtectionMaxAge} seconds, got ${project.skewProtectionMaxAge ?? "<unset>"}.`,
              );
            }

            mkdirSync(".vercel", { recursive: true });
            writeFileSync(
              ".vercel/project.json",
              `${JSON.stringify(
                {
                  projectId: project.id,
                  orgId: teamId,
                  projectName: project.name,
                  settings: {
                    framework: project.framework ?? "nextjs",
                    devCommand: project.devCommand ?? null,
                    installCommand: project.installCommand ?? null,
                    buildCommand: project.buildCommand ?? null,
                    outputDirectory: project.outputDirectory ?? null,
                    rootDirectory: project.rootDirectory ?? null,
                    directoryListing: project.directoryListing ?? false,
                    nodeVersion: project.nodeVersion ?? "24.x",
                  },
                },
                null,
                2,
              )}\n`,
            );

            console.log(`Verified Vercel project ${project.name} with root ${project.rootDirectory}.`);
          }

          main().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Check Vercel Goat env
        if: ${{ (github.event_name == 'workflow_dispatch' || steps.deploy-release.outputs.should_release == 'true') && steps.release-scope.outputs.goat == 'true' }}
        run: |
          node <<'NODE'
          const required = [
            "DATABASE_URL",
            "WORKOS_CLIENT_ID",
            "WORKOS_API_KEY",
            "WORKOS_COOKIE_PASSWORD",
            "GOAT_NEXT_PUBLIC_APP_URL",
            "GOAT_NEXT_PUBLIC_WORKOS_REDIRECT_URI",
            "GOAT_AUTHKIT_DOMAIN",
            "GOAT_MACOS_OAUTH_AUDIENCE",
            "GOAT_MACOS_OAUTH_CLIENT_ID",
            "NEXT_PUBLIC_GOAT_POSTHOG_TOKEN",
            "NEXT_PUBLIC_GOAT_POSTHOG_HOST",
            "VERCEL_AI_GATEWAY_API_KEY",
            "RUNNER_PUBLIC_URL",
            "RUNNER_INTERNAL_TOKEN",
            "ELECTRIC_URL",
            "GOAT_STRIPE_API_KEY",
            "GOAT_STRIPE_CHECKOUT_ENABLED",
            "CRON_SECRET",
            "GOAT_HUBSPOT_CLIENT_ID",
            "GOAT_HUBSPOT_CLIENT_SECRET",
            "GOAT_HUBSPOT_STATE_SECRET",
            "GOAT_X_CLIENT_ID",
            "GOAT_X_CLIENT_SECRET",
            "GOAT_X_STATE_SECRET",
          ];

          async function listProductionEnv(projectId, label, teamId, token) {
            const response = await fetch(
              `https://api.vercel.com/v10/projects/${projectId}/env?teamId=${teamId}&target=production`,
              { headers: { Authorization: `Bearer ${token}` } },
            );

            if (!response.ok) {
              throw new Error(`Could not fetch ${label} Vercel env metadata: ${response.status} ${response.statusText}`);
            }

            const { envs } = await response.json();
            return envs.filter(
              (env) =>
                Array.isArray(env.target) &&
                env.target.includes("production") &&
                !env.gitBranch,
            );
          }

          async function readEnvValue(projectId, envs, key, label, teamId, token) {
            const matches = envs.filter((env) => env.key === key);

            if (matches.length !== 1) {
              throw new Error(`${label} must have exactly one production ${key}; found ${matches.length}.`);
            }

            const response = await fetch(
              `https://api.vercel.com/v1/projects/${projectId}/env/${matches[0].id}?teamId=${teamId}`,
              { headers: { Authorization: `Bearer ${token}` } },
            );

            if (!response.ok) {
              throw new Error(`Could not read ${label} ${key}: ${response.status} ${response.statusText}`);
            }

            const env = await response.json();

            if (env.decrypted !== true || typeof env.value !== "string" || env.value.length === 0) {
              throw new Error(`${label} ${key} could not be decrypted.`);
            }

            return env.value;
          }

          async function main() {
            const goatProjectId = process.env.GOAT_VERCEL_PROJECT_ID;
            const webProjectId = process.env.VERCEL_PROJECT_ID;
            const teamId = process.env.VERCEL_ORG_ID;
            const token = process.env.VERCEL_TOKEN;

            if (!goatProjectId || !webProjectId || !teamId || !token) {
              throw new Error("GOAT_VERCEL_PROJECT_ID, VERCEL_PROJECT_ID, VERCEL_ORG_ID, and VERCEL_TOKEN are required.");
            }

            if (goatProjectId === webProjectId) {
              throw new Error("Goat and web must use separate Vercel projects.");
            }

            const [goatEnv, webEnv] = await Promise.all([
              listProductionEnv(goatProjectId, "Goat", teamId, token),
              listProductionEnv(webProjectId, "web", teamId, token),
            ]);
            const productionKeys = new Set(goatEnv.map((env) => env.key));
            const missing = required.filter((key) => !productionKeys.has(key));
            const requiredWebBilling = ["STRIPE_SECRET_KEY", "STRIPE_WEBHOOK_SECRET"];
            const webProductionKeys = new Set(webEnv.map((env) => env.key));
            const missingWebBilling = requiredWebBilling.filter(
              (key) => !webProductionKeys.has(key),
            );

            console.log(`Vercel Goat production env keys: ${required.length - missing.length}/${required.length} required present.`);

            if (missing.length > 0) {
              throw new Error(`Missing Goat Vercel production env keys: ${missing.join(", ")}`);
            }

            if (missingWebBilling.length > 0) {
              throw new Error(
                `Missing web Vercel production env keys required by Goat billing: ${missingWebBilling.join(", ")}`,
              );
            }

            const checkoutEnabled = await readEnvValue(
              goatProjectId,
              goatEnv,
              "GOAT_STRIPE_CHECKOUT_ENABLED",
              "Goat",
              teamId,
              token,
            );
            if (checkoutEnabled.trim() !== "true") {
              throw new Error(
                "Goat GOAT_STRIPE_CHECKOUT_ENABLED must be true before a production billing release.",
              );
            }

            const expectedGoatOrigin = new URL(process.env.PRODUCTION_GOAT_URL).origin;
            const expectedValues = new Map([
              ["GOAT_NEXT_PUBLIC_APP_URL", expectedGoatOrigin],
              ["GOAT_NEXT_PUBLIC_WORKOS_REDIRECT_URI", `${expectedGoatOrigin}/auth/callback`],
            ]);
            const configuredGoatUrls = await Promise.all(
              Array.from(expectedValues.keys(), (key) =>
                readEnvValue(goatProjectId, goatEnv, key, "Goat", teamId, token),
              ),
            );
            const mismatched = Array.from(expectedValues.entries())
              .filter(([, expected], index) => configuredGoatUrls[index].trim() !== expected)
              .map(([key]) => key);

            if (mismatched.length > 0) {
              throw new Error(
                `Goat Vercel production envs do not match PRODUCTION_GOAT_URL: ${mismatched.join(", ")}`,
              );
            }

            const credentialKeys = ["WORKOS_CLIENT_ID", "WORKOS_API_KEY"];
            const [goatCredentials, webCredentials] = await Promise.all([
              Promise.all(
                credentialKeys.map((key) => readEnvValue(goatProjectId, goatEnv, key, "Goat", teamId, token)),
              ),
              Promise.all(
                credentialKeys.map((key) => readEnvValue(webProjectId, webEnv, key, "web", teamId, token)),
              ),
            ]);

            if (credentialKeys.some((_, index) => goatCredentials[index] === webCredentials[index])) {
              throw new Error(
                "Goat must use a separate WorkOS Application client id and API key from the legacy web app.",
              );
            }

            console.log("Verified that Goat and web use separate WorkOS Application credentials.");
          }

          main().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Build Goat
        if: ${{ (github.event_name == 'workflow_dispatch' || steps.deploy-release.outputs.should_release == 'true') && steps.release-scope.outputs.goat == 'true' }}
        env:
          OBSERVABILITY_RELEASE: ${{ env.RELEASE_SHA }}
          NEXT_PUBLIC_OBSERVABILITY_RELEASE: ${{ env.RELEASE_SHA }}
        run: VERCEL_PROJECT_ID="$GOAT_VERCEL_PROJECT_ID" bunx vercel build --prod --token="$VERCEL_TOKEN" --scope="$VERCEL_ORG_ID" --project="$GOAT_VERCEL_PROJECT_ID"

      - name: Deploy Goat
        id: deploy-goat
        if: ${{ (github.event_name == 'workflow_dispatch' || steps.deploy-release.outputs.should_release == 'true') && steps.release-scope.outputs.goat == 'true' }}
        run: node scripts/release-vercel-deploy.mjs --label Goat --project-env GOAT_VERCEL_PROJECT_ID

      - name: Check Vercel marketing project config
        if: ${{ (github.event_name == 'workflow_dispatch' || steps.deploy-release.outputs.should_release == 'true') && steps.release-scope.outputs.marketing == 'true' }}
        run: |
          rm -rf .vercel

          node <<'NODE'
          const { mkdirSync, writeFileSync } = require("node:fs");

          async function main() {
            const projectId = process.env.MARKETING_VERCEL_PROJECT_ID;
            const webProjectId = process.env.VERCEL_PROJECT_ID;
            const goatProjectId = process.env.GOAT_VERCEL_PROJECT_ID;
            const teamId = process.env.VERCEL_ORG_ID;
            const token = process.env.VERCEL_TOKEN;

            if (!projectId || !teamId || !token) {
              throw new Error("MARKETING_VERCEL_PROJECT_ID, VERCEL_ORG_ID, and VERCEL_TOKEN are required.");
            }

            if (projectId === webProjectId || projectId === goatProjectId) {
              throw new Error("Marketing must use a separate Vercel project from web and Goat.");
            }

            const response = await fetch(
              `https://api.vercel.com/v9/projects/${projectId}?teamId=${teamId}`,
              { headers: { Authorization: `Bearer ${token}` } },
            );

            if (!response.ok) {
              throw new Error(`Could not fetch marketing Vercel project metadata: ${response.status} ${response.statusText}`);
            }

            const project = await response.json();

            if (project.id !== projectId) {
              throw new Error("Fetched Vercel project id does not match MARKETING_VERCEL_PROJECT_ID.");
            }

            if (project.rootDirectory !== "apps/marketing") {
              throw new Error(`Marketing Vercel project rootDirectory must be apps/marketing, got ${project.rootDirectory ?? "<unset>"}.`);
            }

            mkdirSync(".vercel", { recursive: true });
            writeFileSync(
              ".vercel/project.json",
              `${JSON.stringify(
                {
                  projectId: project.id,
                  orgId: teamId,
                  projectName: project.name,
                  settings: {
                    framework: project.framework ?? "nextjs",
                    devCommand: project.devCommand ?? null,
                    installCommand: project.installCommand ?? null,
                    buildCommand: project.buildCommand ?? null,
                    outputDirectory: project.outputDirectory ?? null,
                    rootDirectory: project.rootDirectory ?? null,
                    directoryListing: project.directoryListing ?? false,
                    nodeVersion: project.nodeVersion ?? "24.x",
                  },
                },
                null,
                2,
              )}\n`,
            );

            console.log(`Verified Vercel project ${project.name} with root ${project.rootDirectory}.`);
          }

          main().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Build marketing
        if: ${{ (github.event_name == 'workflow_dispatch' || steps.deploy-release.outputs.should_release == 'true') && steps.release-scope.outputs.marketing == 'true' }}
        env:
          OBSERVABILITY_RELEASE: ${{ env.RELEASE_SHA }}
          NEXT_PUBLIC_OBSERVABILITY_RELEASE: ${{ env.RELEASE_SHA }}
        run: VERCEL_PROJECT_ID="$MARKETING_VERCEL_PROJECT_ID" bunx vercel build --prod --token="$VERCEL_TOKEN" --scope="$VERCEL_ORG_ID" --project="$MARKETING_VERCEL_PROJECT_ID"

      - name: Deploy marketing
        id: deploy-marketing
        if: ${{ (github.event_name == 'workflow_dispatch' || steps.deploy-release.outputs.should_release == 'true') && steps.release-scope.outputs.marketing == 'true' }}
        run: node scripts/release-vercel-deploy.mjs --label marketing --project-env MARKETING_VERCEL_PROJECT_ID

      - name: Cancel runner deploy after Vercel failure
        if: ${{ failure() && steps.trigger-runner.outputs.deploy_id != '' }}
        run: bun run release:render -- --cancel "${{ steps.trigger-runner.outputs.deploy_id }}"

      - name: Wait for runner deploy
        if: ${{ steps.trigger-runner.outputs.deploy_id != '' }}
        run: bun run release:render -- --wait "${{ steps.trigger-runner.outputs.deploy_id }}"

      - name: Smoke check release
        if: ${{ (github.event_name == 'workflow_run' && steps.deploy-release.outputs.should_release == 'true') || (github.event_name == 'workflow_dispatch' && inputs.smoke) }}
        env:
          EXPECTED_WEB_RELEASE: ${{ steps.release-scope.outputs.web == 'true' && env.RELEASE_SHA || '' }}
          EXPECTED_GOAT_RELEASE: ${{ steps.release-scope.outputs.goat == 'true' && env.RELEASE_SHA || '' }}
          EXPECTED_RUNNER_RELEASE: ${{ steps.release-scope.outputs.runner == 'true' && env.RELEASE_SHA || '' }}
          SMOKE_WEB: "true"
          SMOKE_GOAT: "true"
          SMOKE_RUNNER: "true"
          SMOKE_WEB_ATTEMPTS: "12"
          SMOKE_GOAT_ATTEMPTS: "12"
          SMOKE_RUNNER_ATTEMPTS: "12"
          SMOKE_DELAY_MS: "10000"
        run: bun run release:smoke

      - name: Sync Inngest app
        if: ${{ (github.event_name == 'workflow_run' && steps.deploy-release.outputs.should_release == 'true') || github.event_name == 'workflow_dispatch' }}
        env:
          INNGEST_SYNC_ATTEMPTS: "6"
          INNGEST_SYNC_DELAY_MS: "10000"
        run: bun run release:inngest:sync

      - name: Finalize GitHub deployment
        if: ${{ always() && steps.github-deployment.outputs.deployment_id != '' }}
        uses: actions/github-script@v7
        env:
          DEPLOYMENT_ID: ${{ steps.github-deployment.outputs.deployment_id }}
          DEPLOY_RELEASE_SHOULD_RELEASE: ${{ steps.deploy-release.outputs.should_release }}
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const releaseSha = process.env.RELEASE_SHA;
            const shortSha = releaseSha.slice(0, 7);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const succeeded = process.env.JOB_STATUS === "success";
            const skippedBeforeDeploy =
              process.env.GITHUB_EVENT_NAME === "workflow_run" &&
              process.env.DEPLOY_RELEASE_SHOULD_RELEASE === "false";

            const state = skippedBeforeDeploy
              ? "inactive"
              : succeeded
                ? "success"
                : "failure";
            const description = skippedBeforeDeploy
              ? `Production release ${shortSha} was superseded before deploy.`
              : succeeded
                ? `Production release ${shortSha} completed successfully.`
                : `Production release ${shortSha} failed.`;

            const status = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: Number(process.env.DEPLOYMENT_ID),
              state,
              log_url: runUrl,
              environment: "production",
              description,
            };

            if (process.env.PRODUCTION_WEB_URL) {
              status.environment_url = process.env.PRODUCTION_WEB_URL;
            }

            await github.rest.repos.createDeploymentStatus(status);
