name: PR Gate

on:
  pull_request:
    branches: [main, "feat/**"]

# Pull request code is untrusted. This caller and the reusable verifier must stay
# free of secrets, OIDC, production environments, and deploy permissions.
permissions:
  contents: read

concurrency:
  group: pr-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify pull request
    permissions:
      contents: read
    uses: ./.github/workflows/verify.yml
    with:
      base_sha: ${{ github.event.pull_request.base.sha }}
      head_sha: ${{ github.event.pull_request.head.sha }}
      requested_scope: affected
      cache_write: false

  dependency-review:
    name: Dependency review
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  gate:
    name: PR gate
    if: ${{ always() }}
    needs: [verify, dependency-review]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every gate job to pass
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          echo "Upstream job results: ${results}"
          for result in ${results}; do
            if [[ "$result" != "success" ]]; then
              echo "::error::A required PR gate job did not succeed (${result})."
              exit 1
            fi
          done
          echo "All PR gate jobs succeeded."
