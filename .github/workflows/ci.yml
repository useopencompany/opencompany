name: PR Gate

on:
  pull_request:
    branches: [main]

# Pull request code is untrusted. Every job here must stay credential-free: no
# secrets, OIDC, deployments, persistent credentials, or shared writable caches.
# Jobs fan out for wall-clock; the aggregating `gate` job is the single required
# status check, so branch protection never has to track the individual jobs.
permissions:
  contents: read

concurrency:
  group: pr-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CI: true
  DO_NOT_TRACK: "1"
  NODE_OPTIONS: --max-old-space-size=4096
  TURBO_TELEMETRY_DISABLED: "1"
  DATABASE_URL: postgresql://user:password@localhost:5432/opencompany_ci
  WORKOS_CLIENT_ID: client_ci
  WORKOS_API_KEY: sk_test_ci_placeholder
  WORKOS_COOKIE_PASSWORD: replace-with-at-least-32-characters
  OPENCOMPANY_NEXT_PUBLIC_APP_URL: http://localhost:3002
  OPENCOMPANY_NEXT_PUBLIC_WORKOS_REDIRECT_URI: http://localhost:3002/auth/callback

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout the pull request merge commit
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan the pull request commit range for secrets
        uses: trufflesecurity/trufflehog@27b0417c16317ca9a472a9a8092acce143b49c55 # v3.95.9
        with:
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
          version: 3.95.9
          extra_args: --results=verified,unknown

  verify:
    name: Policy, format, and lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout the pull request merge commit
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.2

      - name: Install dependencies from the lockfile
        run: bun install --frozen-lockfile

      - name: Require a migration for schema changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/check-schema-migration.mjs

      - name: Check the migration journal
        run: bun run db:migrations:check

      - name: Check setup script syntax
        run: node --check scripts/setup.mjs

      - name: Check formatting
        run: bun run format:check

      - name: Check application boundaries
        run: bun run boundary:check

      - name: Lint
        run: bun --bun turbo run lint

      - name: Check OpenAPI drift
        run: bun --filter @opencompany/protocol openapi:check

      # scripts/ is not a workspace package, so Turbo does not cover it.
      - name: Test orchestration and workflow policy
        run: node --test scripts/lib/*.test.mjs

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout the pull request merge commit
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.2

      - name: Install dependencies from the lockfile
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout the pull request merge commit
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.2

      - name: Install dependencies from the lockfile
        run: bun install --frozen-lockfile

      - name: Build all workspaces
        run: bun run build

      - name: Build documentation
        run: bun run build:docs

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout the pull request merge commit
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.2

      - name: Install dependencies from the lockfile
        run: bun install --frozen-lockfile

      - name: Test workspaces
        run: bun run test

  # Single required status check. It succeeds only when every job above did, so
  # branch protection can require just `PR gate` and never touch the job list.
  gate:
    name: PR gate
    if: ${{ always() }}
    needs: [secrets, verify, typecheck, build, test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every gate job to pass
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          echo "Upstream job results: ${results}"
          for result in ${results}; do
            if [ "${result}" != "success" ]; then
              echo "::error::A required PR gate job did not succeed (${result})."
              exit 1
            fi
          done
          echo "All PR gate jobs succeeded."
