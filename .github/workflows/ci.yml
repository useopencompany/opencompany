name: PR Gate

on:
  pull_request:
    branches: [main]

# Pull request code is untrusted. This workflow must stay free of deploy-capable
# credentials: no secrets, OIDC, deployments, or persistent git credentials, and
# never `pull_request_target`. Speed comes from Blacksmith runners, Turbo's local
# cache (Blacksmith-backed, no token), and `--affected` — none of which need a
# secret. The aggregating `gate` job is the single required status check, so
# branch protection never has to track the individual jobs.
permissions:
  contents: read

concurrency:
  group: pr-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# The PR checkout is GitHub's synthetic merge commit; give Turbo the real base and
# head SHAs so `--affected` can diff the pull request against its target.
env:
  CI: true
  DO_NOT_TRACK: "1"
  NODE_OPTIONS: --max-old-space-size=4096
  TURBO_TELEMETRY_DISABLED: "1"
  TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha }}
  TURBO_SCM_HEAD: ${{ github.event.pull_request.head.sha }}
  DATABASE_URL: postgresql://user:password@localhost:5432/opencompany_ci
  WORKOS_CLIENT_ID: client_ci
  WORKOS_API_KEY: sk_test_ci_placeholder
  WORKOS_COOKIE_PASSWORD: replace-with-at-least-32-characters
  OPENCOMPANY_NEXT_PUBLIC_APP_URL: http://localhost:3002
  OPENCOMPANY_NEXT_PUBLIC_WORKOS_REDIRECT_URI: http://localhost:3002/auth/callback

jobs:
  secrets:
    name: Secret scan
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - name: Checkout the pull request merge commit
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan the pull request commit range for secrets
        uses: trufflesecurity/trufflehog@27b0417c16317ca9a472a9a8092acce143b49c55 # v3.95.9
        with:
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
          version: 3.95.9
          extra_args: --results=verified,unknown

  checks:
    name: Checks
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - name: Checkout the pull request merge commit
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.2

      # Blacksmith-backed cache (no token). Persists Turbo's local cache and Bun's
      # install cache across runs so unchanged work is restored instead of rebuilt.
      - name: Restore Turbo and Bun caches
        uses: useblacksmith/cache@c5fe29eb0efdf1cf4186b9f7fcbbcbc0cf025662 # v5.0.2
        with:
          path: |
            .turbo
            ~/.bun/install/cache
          key: pr-gate-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ github.sha }}
          restore-keys: |
            pr-gate-${{ runner.os }}-${{ hashFiles('bun.lock') }}-
            pr-gate-${{ runner.os }}-

      - name: Install dependencies from the lockfile
        run: bun install --frozen-lockfile

      - name: Require a migration for schema changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/check-schema-migration.mjs

      - name: Check the migration journal
        run: bun run db:migrations:check

      - name: Check setup script syntax
        run: node --check scripts/setup.mjs

      - name: Check formatting
        run: bun run format:check

      - name: Check application boundaries
        run: bun run boundary:check

      - name: Check OpenAPI drift
        run: bun --filter @opencompany/protocol openapi:check

      # One Turbo run so lint, typecheck, build (incl. docs), and test parallelize
      # across packages and restore from cache; `--affected` skips packages the
      # pull request does not touch.
      - name: Lint, typecheck, build, and test affected packages
        run: bun --bun turbo run lint typecheck build test --affected

      # scripts/ is not a workspace package, so Turbo does not cover it.
      - name: Test orchestration and workflow policy
        run: node --test scripts/lib/*.test.mjs

  # Single required status check. It succeeds only when every job above did, so
  # branch protection can require just `PR gate` and never touch the job list.
  gate:
    name: PR gate
    if: ${{ always() }}
    needs: [secrets, checks]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every gate job to pass
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          echo "Upstream job results: ${results}"
          for result in ${results}; do
            if [ "${result}" != "success" ]; then
              echo "::error::A required PR gate job did not succeed (${result})."
              exit 1
            fi
          done
          echo "All PR gate jobs succeeded."
