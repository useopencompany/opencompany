name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Pull request workflows check out GitHub's synthetic merge commit, which does not
# provide the local `main` ref Turbo expects when resolving `--affected`.
env:
  TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha }}
  TURBO_SCM_HEAD: ${{ github.event.pull_request.head.sha }}

jobs:
  static:
    name: Format, lint, and typecheck
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://user:password@localhost:5432/opencompany_ci
      WORKOS_CLIENT_ID: client_ci
      WORKOS_API_KEY: sk_test_ci_placeholder
      WORKOS_COOKIE_PASSWORD: replace-with-at-least-32-characters
      NEXT_PUBLIC_WORKOS_REDIRECT_URI: http://localhost:3000/auth/callback
      GOAT_NEXT_PUBLIC_APP_URL: http://localhost:3002
      GOAT_NEXT_PUBLIC_WORKOS_REDIRECT_URI: http://localhost:3002/auth/callback
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0

      - name: Require a migration for schema changes
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          changed_files="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          added_migrations="$(git diff --diff-filter=A --name-only "$BASE_SHA" "$HEAD_SHA")"
          if printf '%s\n' "$changed_files" | rg -q '^packages/db/src/(goat-)?schema\.ts$' && ! printf '%s\n' "$added_migrations" | rg -q '^drizzle/[0-9][^/]*\.sql$'; then
            echo "A change to packages/db/src/schema.ts or packages/db/src/goat-schema.ts requires a numbered Drizzle migration."
            exit 1
          fi

      - name: Check migration journal
        run: node scripts/check-migration-journal.mjs

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting
        run: bun run format:check

      - name: Lint and typecheck
        run: bun --bun turbo run lint typecheck ${{ github.event_name == 'pull_request' && '--affected' || '' }}

  build:
    name: Build
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://user:password@localhost:5432/opencompany_ci
      WORKOS_CLIENT_ID: client_ci
      WORKOS_API_KEY: sk_test_ci_placeholder
      WORKOS_COOKIE_PASSWORD: replace-with-at-least-32-characters
      NEXT_PUBLIC_WORKOS_REDIRECT_URI: http://localhost:3000/auth/callback
      GOAT_NEXT_PUBLIC_APP_URL: http://localhost:3002
      GOAT_NEXT_PUBLIC_WORKOS_REDIRECT_URI: http://localhost:3002/auth/callback
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun --bun turbo run build ${{ github.event_name == 'pull_request' && '--affected' || '' }}

  test:
    name: Test
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://user:password@localhost:5432/opencompany_ci
      WORKOS_CLIENT_ID: client_ci
      WORKOS_API_KEY: sk_test_ci_placeholder
      WORKOS_COOKIE_PASSWORD: replace-with-at-least-32-characters
      NEXT_PUBLIC_WORKOS_REDIRECT_URI: http://localhost:3000/auth/callback
      GOAT_NEXT_PUBLIC_APP_URL: http://localhost:3002
      GOAT_NEXT_PUBLIC_WORKOS_REDIRECT_URI: http://localhost:3002/auth/callback
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        run: bun --bun turbo run test ${{ github.event_name == 'pull_request' && '--affected' || '' }}

      # scripts/ is not a workspace package, so turbo test doesn't cover it.
      - name: Test orchestration scripts
        run: >-
          node --test
          scripts/lib/preview-config.test.mjs
          scripts/lib/preview-render.test.mjs
          scripts/lib/preview-debug-session.test.mjs
          scripts/lib/release-scope.test.mjs
          scripts/lib/release-smoke.test.mjs

  secrets:
    name: Secret scan
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0

      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@27b0417c16317ca9a472a9a8092acce143b49c55 # v3.95.9
        with:
          extra_args: --results=verified,unknown
