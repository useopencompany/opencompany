name: Build mobile app

on:
  workflow_dispatch:

concurrency:
  group: build-mobile-app-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  build:
    name: Build iOS (production)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      CI: true
      DO_NOT_TRACK: "1"
      INFISICAL_MACHINE_IDENTITY_ID: "251c74b2-32d5-490a-abfa-12d83f59ed7b"
      INFISICAL_ENV_SLUG: ${{ vars.INFISICAL_ENV_SLUG || secrets.INFISICAL_ENV_SLUG || 'prod' }}
      INFISICAL_DOMAIN: ${{ vars.INFISICAL_DOMAIN || secrets.INFISICAL_DOMAIN || 'https://eu.infisical.com' }}
    steps:
      - name: Checkout build commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Install dependencies from the lockfile
        run: bun install --frozen-lockfile

      - name: Setup EAS
        uses: expo/expo-github-action@eab7a230208c952974db8c3245cfd78402c7b385 # v9
        with:
          eas-version: 24.x.x
          packager: bun

      - name: Fetch mobile build secrets from Infisical
        uses: Infisical/secrets-action@6cd3f7c0e4cc0d2395ee4ef414eb6eeb5d3e73db # v1.0.17
        with:
          method: oidc
          identity-id: ${{ env.INFISICAL_MACHINE_IDENTITY_ID }}
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG || secrets.INFISICAL_PROJECT_SLUG }}
          env-slug: ${{ env.INFISICAL_ENV_SLUG }}
          domain: ${{ env.INFISICAL_DOMAIN }}
          secret-path: /mobile

      - name: Check mobile build env
        shell: bash
        run: |
          required=(
            APP_VARIANT
            EXPO_TOKEN
            ASC_P8_KEY
            EXPO_ASC_KEY_ID
            EXPO_ASC_ISSUER_ID
            EXPO_APPLE_TEAM_ID
            EXPO_APPLE_TEAM_TYPE
            EXPO_PUBLIC_OPENCOMPANY_API_ORIGIN
            EXPO_PUBLIC_POSTHOG_API_KEY
            EXPO_PUBLIC_WORKOS_CLIENT_ID
            SENTRY_AUTH_TOKEN
          )
          missing=()
          for variable_name in "${required[@]}"; do
            if [[ -z "${!variable_name:-}" ]]; then missing+=("$variable_name"); fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf '::error::Missing required mobile build environment variables: %s\n' "${missing[*]}"
            exit 1
          fi
          if [[ "$APP_VARIANT" != "production" ]]; then
            echo "::error::APP_VARIANT must be production."
            exit 1
          fi
          case "$EXPO_APPLE_TEAM_TYPE" in
            IN_HOUSE|COMPANY_OR_ORGANIZATION|INDIVIDUAL) ;;
            *)
              echo "::error::EXPO_APPLE_TEAM_TYPE must be IN_HOUSE, COMPANY_OR_ORGANIZATION, or INDIVIDUAL."
              exit 1
              ;;
          esac

      - name: Write Expo build environment
        shell: bash
        run: |
          umask 077
          {
            printf 'APP_VARIANT=%s\n' "$APP_VARIANT"
            printf 'EXPO_PUBLIC_OPENCOMPANY_API_ORIGIN=%s\n' "$EXPO_PUBLIC_OPENCOMPANY_API_ORIGIN"
            printf 'EXPO_PUBLIC_POSTHOG_API_KEY=%s\n' "$EXPO_PUBLIC_POSTHOG_API_KEY"
            printf 'EXPO_PUBLIC_WORKOS_CLIENT_ID=%s\n' "$EXPO_PUBLIC_WORKOS_CLIENT_ID"
          } > "$GITHUB_WORKSPACE/apps/mobile/.env"
          printf 'SENTRY_AUTH_TOKEN=%s\n' "$SENTRY_AUTH_TOKEN" > "$GITHUB_WORKSPACE/apps/mobile/.env.sentry-build-plugin"

          scope_ignore_rules() {
            local prefix="$1"
            local ignore_file="$2"
            awk -v prefix="$prefix" '
              /^[[:space:]]*#/ || /^[[:space:]]*$/ { print; next }
              {
                negated = substr($0, 1, 1) == "!"
                rule = negated ? substr($0, 2) : $0
                anchored = substr(rule, 1, 1) == "/"
                if (anchored) rule = substr(rule, 2)
                if (!anchored && index(rule, "/") == 0) rule = "**/" rule
                printf "%s%s/%s\n", negated ? "!" : "", prefix, rule
              }
            ' "$ignore_file"
          }

          {
            cat "$GITHUB_WORKSPACE/.gitignore"
            scope_ignore_rules "apps/mobile" "$GITHUB_WORKSPACE/apps/mobile/.gitignore"
            scope_ignore_rules "apps/desktop" "$GITHUB_WORKSPACE/apps/desktop/.gitignore"
            printf '\n!apps/mobile/.env\n'
            printf '!apps/mobile/.env.sentry-build-plugin\n'
          } > "$GITHUB_WORKSPACE/.easignore"

      - name: Inspect EAS upload archive
        working-directory: apps/mobile
        run: eas build:inspect --platform ios --profile production --stage archive --output "$RUNNER_TEMP/mobile-eas-archive"

      - name: Check EAS upload archive
        run: node scripts/check-mobile-build-archive.mjs "$RUNNER_TEMP/mobile-eas-archive"

      - name: Write ASC API key
        shell: bash
        run: |
          key_path="$RUNNER_TEMP/asc-api-key.p8"
          umask 077
          printf '%s\n' "$ASC_P8_KEY" > "$key_path"
          {
            echo "EXPO_ASC_API_KEY_PATH=$key_path"
            echo "ASC_P8_KEY="
          } >> "$GITHUB_ENV"

      - name: Build iOS app
        working-directory: apps/mobile
        env:
          EAS_BUILD_NO_EXPO_GO_WARNING: "true"
          EXPO_NO_CAPABILITY_SYNC: "1"
        run: eas build --platform ios --profile production --non-interactive --wait --auto-submit

      - name: Remove temporary build files
        if: ${{ always() }}
        run: |
          rm -f \
            "$RUNNER_TEMP/asc-api-key.p8" \
            "$GITHUB_WORKSPACE/.easignore" \
            "$GITHUB_WORKSPACE/apps/mobile/.env" \
            "$GITHUB_WORKSPACE/apps/mobile/.env.sentry-build-plugin"
          rm -rf "$RUNNER_TEMP/mobile-eas-archive"
