services:
  - type: web
    name: opencompany-api
    runtime: docker
    plan: standard
    region: frankfurt
    autoDeployTrigger: off
    dockerfilePath: ./Dockerfile.api
    healthCheckPath: /healthz
    maxShutdownDelaySeconds: 60
    # The Infisical -> Render integration syncs prod `/api` into this service. Redis improves
    # presentation cadence, but the API remains correct when REDIS_URL is missing or unavailable.
    envVars:
      - key: API_DATABASE_URL
        sync: false
      - key: API_DB_POOL_MAX
        sync: false
      - key: API_BROWSER_ORIGINS
        sync: false
      # Canonical origin used by the API and runner when the plugin gateway
      # connects to API-hosted first-party MCP servers.
      - key: OPENCOMPANY_API_ORIGIN
        sync: false
      - key: WORKOS_CLIENT_ID
        sync: false
      - key: WORKOS_MOBILE_CLIENT_ID
        sync: false
      - key: WORKOS_API_KEY
        sync: false
      - key: WORKOS_COOKIE_PASSWORD
        sync: false
      - key: WORKOS_COOKIE_NAME
        sync: false
      - key: WORKOS_COOKIE_DOMAIN
        sync: false
      - key: OPENCOMPANY_AUTHKIT_DOMAIN
        sync: false
      - key: OPENCOMPANY_API_OAUTH_AUDIENCE
        sync: false
      - key: OPENCOMPANY_DEFAULT_CHAT_MODEL
        sync: false
      # Brain source option listing decrypts stored provider credentials in the API since the
      # #1214 cutover, so the API runtime needs the same key as web and runner.
      - key: INTEGRATION_CREDENTIAL_ENCRYPTION_KEY
        sync: false
      # Canonical Auto model classification. Kept server-side in prod `/api`.
      - key: VERCEL_AI_GATEWAY_API_KEY
        sync: false
      # GitHub App OAuth + webhook ingress moved to the API in the #1203 4a1
      # cutover. Redirects and install/callback URLs stay on the web origin,
      # which is why the API also needs the canonical app URL.
      - key: OPENCOMPANY_NEXT_PUBLIC_APP_URL
        sync: false
      # Billing/usage commands and read models, the Stripe webhook, and the
      # hourly reconcile handler moved to the API in the #1203 5b1 cutover.
      - key: OPENCOMPANY_STRIPE_API_KEY
        sync: false
      - key: OPENCOMPANY_STRIPE_WEBHOOK_SECRET
        sync: false
      - key: OPENCOMPANY_STRIPE_CHECKOUT_ENABLED
        sync: false
      # Shared with the web cron/unsubscribe relays. It authenticates only the
      # API's internal onboarding-email persistence endpoints.
      - key: CRON_SECRET
        sync: false
      - key: MONID_API_KEY
        sync: false
      # Dedicated user-authorized GitHub App for the official GitHub Plugin.
      - key: GITHUB_USER_APP_SLUG
        sync: false
      - key: GITHUB_USER_APP_CLIENT_ID
        sync: false
      - key: GITHUB_USER_APP_CLIENT_SECRET
        sync: false
      - key: GITHUB_USER_APP_STATE_SECRET
        sync: false
      # Google-family OAuth ingress moved to the API in the #1203 4a2 cutover
      # (Gmail, Calendar, Drive; Drive webhook verification is row-based).
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: GOOGLE_INTEGRATION_STATE_SECRET
        sync: false
      # Official Slack plugin OAuth + Linear ingest OAuth/webhook ingress.
      - key: OPENCOMPANY_SLACK_CLIENT_ID
        sync: false
      - key: OPENCOMPANY_SLACK_CLIENT_SECRET
        sync: false
      - key: OPENCOMPANY_SLACK_STATE_SECRET
        sync: false
      - key: OPENCOMPANY_LINEAR_CLIENT_ID
        sync: false
      - key: OPENCOMPANY_LINEAR_CLIENT_SECRET
        sync: false
      - key: OPENCOMPANY_LINEAR_WEBHOOK_SECRET
        sync: false
      - key: OPENCOMPANY_LINEAR_STATE_SECRET
        sync: false
      # HubSpot OAuth + webhook ingress moved to the API in the #1203 4c
      # cutover. Attio and Jamie webhooks moved too but verify against
      # per-integration credentials, so they need no env.
      - key: OPENCOMPANY_HUBSPOT_CLIENT_ID
        sync: false
      - key: OPENCOMPANY_HUBSPOT_CLIENT_SECRET
        sync: false
      - key: OPENCOMPANY_HUBSPOT_STATE_SECRET
        sync: false
      # HubSpot MCP auth-app credentials are a distinct OAuth audience from
      # the read-only ingestion app above.
      - key: OPENCOMPANY_HUBSPOT_MCP_CLIENT_ID
        sync: false
      - key: OPENCOMPANY_HUBSPOT_MCP_CLIENT_SECRET
        sync: false
      # #1203 4d1 cutover: remote-MCP (Linear/PostHog/Neon/Latitude), X account,
      # and Slack answer-bot OAuth/webhook ingress moved to the API.
      - key: MCP_OAUTH_STATE_SECRET
        sync: false
      - key: OPENCOMPANY_X_CLIENT_ID
        sync: false
      - key: OPENCOMPANY_X_CLIENT_SECRET
        sync: false
      - key: OPENCOMPANY_X_STATE_SECRET
        sync: false
      - key: OPENCOMPANY_SLACK_BOT_CLIENT_ID
        sync: false
      - key: OPENCOMPANY_SLACK_BOT_CLIENT_SECRET
        sync: false
      - key: OPENCOMPANY_SLACK_BOT_SIGNING_SECRET
        sync: false
      - key: OPENCOMPANY_SLACK_BOT_STATE_SECRET
        sync: false
      # Feedback submission moved behind POST /v1/feedback in the #1203 5a1
      # cutover: the API dispatches sidebar feedback to Linear. Optional — when
      # unset, feedback submission fails with a clear error and nothing else
      # degrades.
      - key: LINEAR_API_KEY
        sync: false
      - key: OPENCOMPANY_FEEDBACK_LINEAR_TEAM_ID
        sync: false
      - key: OPENCOMPANY_FEEDBACK_LINEAR_LABELS
        sync: false
      - key: OPENCOMPANY_FEEDBACK_LINEAR_PROJECT_ID
        sync: false
      # Server-side integration analytics (fire-and-forget; safe when unset).
      - key: NEXT_PUBLIC_OPENCOMPANY_POSTHOG_TOKEN
        sync: false
      - key: NEXT_PUBLIC_OPENCOMPANY_POSTHOG_HOST
        sync: false
      # Engine auth (Codex device flow, Infisical browser login) moved behind
      # /v1 in the #1203 5a3 cutover: the API now makes the sanctioned control
      # calls to the runner's internal auth routes. RUNNER_INTERNAL_URL is an
      # optional override; the public URL is the guaranteed fallback, mirroring
      # the web requiredness.
      - key: RUNNER_PUBLIC_URL
        sync: false
      - key: RUNNER_INTERNAL_URL
        sync: false
      - key: RUNNER_INTERNAL_TOKEN
        sync: false
      # Shared API-boundary signing secret. It validates runner→API wiki calls
      # and signs short-lived, tool-bound tickets for first-party plugin MCPs.
      # Keep the API and runner values in sync.
      - key: API_INTERNAL_TOKEN
        sync: false
      # Browser profiles moved behind /v1 in the #1203 3e cutover. The feature is
      # flag-gated; the Browserbase credentials are only exercised when
      # OPENCOMPANY_BROWSER_PROFILES_ENABLED is "true".
      - key: OPENCOMPANY_BROWSER_PROFILES_ENABLED
        sync: false
      - key: OPENCOMPANY_BROWSER_PROFILES_KILL_SWITCH
        sync: false
      - key: BROWSERBASE_API_KEY
        sync: false
      - key: BROWSERBASE_PROJECT_ID
        sync: false
      # Task admission snapshots runner-owned tool availability. These are
      # optional and must match the runner when their capabilities are enabled.
      - key: APIFY_API_TOKEN
        sync: false
      - key: RUNNER_OPENCOMPANY_BROWSER_ENABLED
        sync: false
      - key: OPENCOMPANY_MANAGED_CAPABILITIES_KILL_SWITCH
        sync: false
      - key: OPENCOMPANY_DISABLED_MANAGED_CAPABILITY_ACTIONS
        sync: false
      # Optional Brain retrieval/model tuning; defaults are safe when unset.
      - key: OPENCOMPANY_BRAIN_GATEWAY_BASE_URL
        sync: false
      - key: OPENCOMPANY_BRAIN_EMBEDDING_MODEL
        sync: false
      - key: OPENCOMPANY_BRAIN_VECTOR_MAX_DISTANCE
        sync: false
      - key: BLOB_READ_WRITE_TOKEN
        sync: false
      - key: ELECTRIC_URL
        sync: false
      - key: ELECTRIC_SOURCE_ID
        sync: false
      - key: ELECTRIC_SOURCE_SECRET
        sync: false
      - key: ELECTRIC_SECRET
        sync: false
      - key: ELECTRIC_TOKEN
        sync: false
      - key: REDIS_URL
        sync: false
      - key: OPENCOMPANY_OBSERVABILITY_ENABLED
        sync: false
      - key: OPENCOMPANY_OTEL_EXPORTER_OTLP_ENDPOINT
        sync: false
      - key: OPENCOMPANY_OTEL_EXPORTER_OTLP_HEADERS
        sync: false
      - key: OBSERVABILITY_ENABLED
        sync: false
      - key: OBSERVABILITY_ENV
        sync: false
      - key: OBSERVABILITY_RELEASE
        sync: false
      - key: OBSERVABILITY_LOG_LEVEL
        sync: false
      - key: OBSERVABILITY_TIMING
        sync: false
      # Compatibility billing and ingestion events still target the generic
      # PostHog project from the API runtime.
      - key: NEXT_PUBLIC_POSTHOG_TOKEN
        sync: false
      - key: NEXT_PUBLIC_POSTHOG_HOST
        sync: false
      - key: LATITUDE_API_KEY
        sync: false
      - key: LATITUDE_PROJECT_SLUG
        sync: false
      - key: LATITUDE_SERVICE_NAME
        sync: false
      - key: LATITUDE_TELEMETRY_DISABLED
        sync: false

  - type: web
    name: opencompany-runner
    runtime: docker
    plan: standard
    autoDeployTrigger: off
    dockerfilePath: ./Dockerfile.runner
    healthCheckPath: /healthz
    maxShutdownDelaySeconds: 300
    # `sync: false` only tells Render not to generate these values. Secret values are populated by
    # the Infisical → Render integration, which syncs the prod `/runner` folder into this service.
    # Add new secrets to Infisical (`prod`, path `/runner`); no manual Render dashboard entry needed.
    envVars:
      - key: DATABASE_URL
        sync: false
      # Direct (non-pooled) Neon endpoint for the runner's pooled pg driver. If unset,
      # the runner derives it from DATABASE_URL by stripping the "-pooler" host label.
      - key: RUNNER_DATABASE_URL
        sync: false
      # Max parallel sessions per instance (default 8). Sessions are I/O-bound, so the real
      # ceiling is the single event loop + E2B sandbox quota + model-gateway rate limits, not
      # CPU/RAM. Scale past one instance with `numInstances`; job + run leases make that safe.
      - key: RUNNER_WORKER_CONCURRENCY
        sync: false
      # Optional: runner DB pool size (default 10). Size it as RUNNER_WORKER_CONCURRENCY plus
      # headroom for HTTP routes, the poller, and lease heartbeats. Hard ceiling is Neon's
      # max_connections (~901), shared with opencompany and support services: keep instances * max well
      # under it.
      - key: RUNNER_DB_POOL_MAX
        sync: false
      - key: RUNNER_JOB_LEASE_TTL_MS
        sync: false
      - key: RUNNER_INTERNAL_TOKEN
        sync: false
      # Runner→API wiki command boundary: the canonical API origin the runner
      # posts commands to, and the bearer the API validates. Agent wiki writes
      # fail closed without both; keep API_INTERNAL_TOKEN in sync with the API.
      - key: OPENCOMPANY_API_ORIGIN
        sync: false
      - key: API_INTERNAL_TOKEN
        sync: false
      # This service is the production execution composition root. The release
      # preflight requires the worker gate to be explicitly enabled.
      - key: RUNNER_OPENCOMPANY_TASK_WORKER_ENABLED
        sync: false
      # Managed E2B sandbox creation and reconciliation share this ownership boundary.
      # Local setup generates a different namespace even when the E2B API key is shared.
      - key: RUNNER_SANDBOX_NAMESPACE
        sync: false
      - key: NEXT_PUBLIC_OPENCOMPANY_POSTHOG_TOKEN
        sync: false
      - key: NEXT_PUBLIC_OPENCOMPANY_POSTHOG_HOST
        sync: false
      # Retained ingestion analytics still emit to the generic PostHog project.
      - key: NEXT_PUBLIC_POSTHOG_TOKEN
        sync: false
      - key: NEXT_PUBLIC_POSTHOG_HOST
        sync: false
      # Canonical opencompany origin used when shared integrations construct web callback URLs.
      # The origin is not an execution transport and is never injected into E2B.
      - key: OPENCOMPANY_NEXT_PUBLIC_APP_URL
        sync: false
      # Claude MCP uses Render's automatic RENDER_EXTERNAL_URL. RUNNER_PUBLIC_URL remains an
      # explicit override for non-Render deployments and local development, so it is not synced.
      - key: RUNNER_STREAM_TOKEN_SECRET
        sync: false
      - key: INTEGRATION_CREDENTIAL_ENCRYPTION_KEY
        sync: false
      - key: RUNNER_ALLOWED_ORIGINS
        sync: false
      # Base hostname for signed Codex workspace previews. Configure both this hostname and its
      # wildcard (*.hostname) as Render custom domains, then point wildcard DNS at Render.
      - key: RUNNER_PREVIEW_BASE_DOMAIN
        sync: false
      # Optional preview URL scheme override. Hosted previews default to HTTPS.
      - key: RUNNER_PREVIEW_PROTOCOL
        sync: false
      - key: E2B_API_KEY
        sync: false
      - key: VERCEL_AI_GATEWAY_API_KEY
        sync: false
      # Optional opencompany OpenTelemetry export to SigNoz. Populated from Infisical prod `/runner`.
      - key: OPENCOMPANY_OBSERVABILITY_ENABLED
        sync: false
      - key: OPENCOMPANY_OTEL_EXPORTER_OTLP_ENDPOINT
        sync: false
      - key: OPENCOMPANY_OTEL_EXPORTER_OTLP_HEADERS
        sync: false
      # Server-side upstream credential for the LLM broker's `openai` provider. Use a
      # budget-capped OpenAI project key.
      - key: OPENAI_CODEX_API_KEY
        sync: false
      # Private Vercel Blob store token. The runner downloads attachment bytes (images/PDFs)
      # to inline into model calls. Populated from Infisical prod `/runner`.
      - key: BLOB_READ_WRITE_TOKEN
        sync: false
      # Shared transient canonical Chat presentation stream. Postgres remains authoritative if
      # this optional dependency is unavailable.
      - key: REDIS_URL
        sync: false
      - key: EXA_API_KEY
        sync: false
      - key: APIFY_API_TOKEN
        sync: false
      - key: MONID_API_KEY
        sync: false
      # Refreshes the personal GitHub App user token before sandbox injection.
      - key: GITHUB_USER_APP_CLIENT_ID
        sync: false
      - key: GITHUB_USER_APP_CLIENT_SECRET
        sync: false
      # Google OAuth client, used by the runner to refresh Gmail/Calendar access tokens.
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      # X OAuth client, used by the runner to refresh access tokens before posting.
      - key: OPENCOMPANY_X_CLIENT_ID
        sync: false
      - key: OPENCOMPANY_X_CLIENT_SECRET
        sync: false
      # HubSpot snapshots refresh short-lived OAuth tokens in the runner.
      - key: OPENCOMPANY_HUBSPOT_CLIENT_ID
        sync: false
      - key: OPENCOMPANY_HUBSPOT_CLIENT_SECRET
        sync: false
      # Refreshes audience-bound HubSpot MCP OAuth tokens for plugin calls.
      - key: OPENCOMPANY_HUBSPOT_MCP_CLIENT_ID
        sync: false
      - key: OPENCOMPANY_HUBSPOT_MCP_CLIENT_SECRET
        sync: false
      # Optional opencompany rendered-browser task tools.
      - key: RUNNER_OPENCOMPANY_BROWSER_ENABLED
        sync: false
      - key: OPENCOMPANY_CODEX_E2B_TEMPLATE
        sync: false
      - key: RUNNER_CODEX_MODEL
        sync: false
      - key: RUNNER_CODEX_TIMEOUT_MS
        sync: false
      - key: RUNNER_CODEX_API_KEY_FALLBACK_ENABLED
        sync: false
      - key: RUNNER_OPENCOMPANY_CODEX_CHAT_IDLE_TIMEOUT_MS
        sync: false
      - key: RUNNER_OPENCOMPANY_CODEX_CHAT_LEASE_TTL_MS
        sync: false
      # Optional upstream key for the runner's OpenAI provider and voice models.
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENCOMPANY_DICTATION_REALTIME_MODEL
        sync: false
      - key: OPENCOMPANY_DICTATION_FINAL_MODEL
        sync: false
      # Optional Brain/model/action tuning and emergency controls.
      - key: OPENCOMPANY_BRAIN_GATEWAY_BASE_URL
        sync: false
      - key: OPENCOMPANY_BRAIN_EMBEDDING_MODEL
        sync: false
      - key: OPENCOMPANY_BRAIN_VECTOR_MAX_DISTANCE
        sync: false
      - key: OPENCOMPANY_CHAT_ACTIONS_KILL_SWITCH
        sync: false
      - key: OPENCOMPANY_CHAT_SANDBOX_IMAGE
        sync: false
      - key: OPENCOMPANY_MANAGED_CAPABILITIES_KILL_SWITCH
        sync: false
      - key: OPENCOMPANY_DISABLED_MANAGED_CAPABILITY_ACTIONS
        sync: false
      - key: OPENCOMPANY_REVOLUT_BUSINESS_WORKSPACE_ID
        sync: false
      - key: OPENCOMPANY_REVOLUT_BUSINESS_API_TOKEN
        sync: false
      - key: OPENCOMPANY_REVOLUT_BUSINESS_ACCOUNT_LABEL
        sync: false
      - key: OPENCOMPANY_REVOLUT_BUSINESS_API_BASE_URL
        sync: false
      - key: RUNNER_INSTANCE_ID
        sync: false
      - key: BETTER_STACK_ERRORS_DSN
        sync: false
      - key: OBSERVABILITY_ENABLED
        sync: false
      - key: OBSERVABILITY_ENV
        sync: false
      - key: OBSERVABILITY_RELEASE
        sync: false
      - key: OBSERVABILITY_LOG_LEVEL
        sync: false
      - key: OBSERVABILITY_TIMING
        sync: false
      - key: BRAINTRUST_ENABLED
        sync: false
      - key: BRAINTRUST_API_KEY
        sync: false
      - key: BRAINTRUST_PROJECT_ID
        sync: false
      - key: BRAINTRUST_PROJECT_NAME
        sync: false
      - key: LATITUDE_API_KEY
        sync: false
      - key: LATITUDE_PROJECT_SLUG
        sync: false
      - key: LATITUDE_SERVICE_NAME
        sync: false
      - key: LATITUDE_TELEMETRY_DISABLED
        sync: false
