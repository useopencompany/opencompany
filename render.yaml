services:
  - type: web
    name: opencompany-runner
    runtime: docker
    plan: standard
    autoDeployTrigger: off
    dockerfilePath: ./Dockerfile.runner
    healthCheckPath: /healthz
    maxShutdownDelaySeconds: 120
    # `sync: false` only tells Render not to generate these values. Secret values are populated by
    # the Infisical → Render integration, which syncs the prod `/runner` folder into this service.
    # Add new secrets to Infisical (`prod`, path `/runner`); no manual Render dashboard entry needed.
    envVars:
      - key: DATABASE_URL
        sync: false
      # Direct (non-pooled) Neon endpoint for the runner's pooled pg driver. If unset,
      # the runner derives it from DATABASE_URL by stripping the "-pooler" host label.
      - key: RUNNER_DATABASE_URL
        sync: false
      # Max parallel sessions per instance (default 8). Sessions are I/O-bound, so the real
      # ceiling is the single event loop + E2B sandbox quota + model-gateway rate limits, not
      # CPU/RAM. Scale past one instance with `numInstances`; job + run leases make that safe.
      - key: RUNNER_WORKER_CONCURRENCY
        sync: false
      # Optional: runner DB pool size (default 10). Size it as RUNNER_WORKER_CONCURRENCY plus
      # headroom for HTTP routes, the poller, and lease heartbeats. Hard ceiling is Neon's
      # max_connections (~901), shared with the web app + Inngest: keep instances * max well
      # under it.
      - key: RUNNER_DB_POOL_MAX
        sync: false
      - key: RUNNER_INTERNAL_TOKEN
        sync: false
      - key: RUNNER_STREAM_TOKEN_SECRET
        sync: false
      - key: DURABLE_STREAMS_URL
        sync: false
      - key: DURABLE_STREAMS_TOKEN
        sync: false
      - key: INTEGRATION_CREDENTIAL_ENCRYPTION_KEY
        sync: false
      - key: RUNNER_ALLOWED_ORIGINS
        sync: false
      - key: E2B_API_KEY
        sync: false
      - key: VERCEL_AI_GATEWAY_API_KEY
        sync: false
      # Private Vercel Blob store token. The runner downloads attachment bytes (images/PDFs)
      # to inline into model calls. Populated from Infisical prod `/runner`.
      - key: BLOB_READ_WRITE_TOKEN
        sync: false
      - key: EXA_API_KEY
        sync: false
      - key: APIFY_API_TOKEN
        sync: false
      - key: SUPADATA_API_KEY
        sync: false
      - key: OPENCOMPANY_E2B_TEMPLATE
        sync: false
      - key: RUNNER_E2B_IDLE_TIMEOUT_MS
        sync: false
      - key: RUNNER_INSTANCE_ID
        sync: false
      - key: GITHUB_APP_ID
        sync: false
      - key: GITHUB_APP_INSTALLATION_ID
        sync: false
      - key: GITHUB_APP_PRIVATE_KEY
        sync: false
      - key: BETTER_STACK_ERRORS_DSN
        sync: false
      - key: OBSERVABILITY_ENABLED
        sync: false
      - key: OBSERVABILITY_ENV
        sync: false
      - key: OBSERVABILITY_RELEASE
        sync: false
      - key: OBSERVABILITY_LOG_LEVEL
        sync: false
      - key: OBSERVABILITY_TIMING
        sync: false
