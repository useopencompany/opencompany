<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>opencompany — offline</title>
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0b0b0c;
        color: #ededed;
        font-family:
          ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        -webkit-user-select: none;
        user-select: none;
        -webkit-app-region: drag;
      }
      .card {
        text-align: center;
        max-width: 22rem;
        padding: 2rem;
      }
      h1 {
        font-size: 1.1rem;
        font-weight: 600;
        margin: 0 0 0.5rem;
      }
      p {
        font-size: 0.9rem;
        line-height: 1.5;
        color: #a1a1a1;
        margin: 0 0 1.5rem;
      }
      button {
        appearance: none;
        border: 0;
        border-radius: 0.5rem;
        background: #7c5cff;
        color: #fff;
        font-size: 0.9rem;
        font-weight: 500;
        padding: 0.55rem 1.1rem;
        cursor: pointer;
        -webkit-app-region: no-drag;
      }
      button:hover {
        background: #8f73ff;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>You're offline</h1>
      <p>opencompany couldn't reach the network. Check your connection and try again.</p>
      <button id="retry" type="button">Retry</button>
    </div>
    <script>
      document.getElementById("retry").addEventListener("click", () => {
        window.opencompanyDesktop?.retryConnection();
      });
    </script>
  </body>
</html>
