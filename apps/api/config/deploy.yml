# The release workflow deploys this from apps/api with `kamal deploy`. Never run `kamal setup` once
# the server is up: it reboots the Electric accessory. docs/hosting.md covers the server, the
# manual commands and the Render cutover.
service: opencompany-api
image: useopencompany/opencompany-api

servers:
  web:
    hosts:
      - 91.99.204.222
    options:
      # For a `docker stop` without -t, such as a daemon restart.
      stop-timeout: 60

proxy:
  ssl: true
  # kamal-proxy issues one Let's Encrypt certificate per host on its first request.
  # api-next is the pre-cutover test hostname; PR 3 of the Hetzner move removes it.
  hosts:
    - api.opencompany.chat
    - api-next.opencompany.chat
  app_port: 3001
  healthcheck:
    path: /healthz
    interval: 3
    timeout: 5
  # Chat streams over SSE and Electric live shapes hold a request open for minutes. 0 turns off
  # kamal-proxy's response-header timeout; Bun and the clients still bound each request.
  response_timeout: 0
  # Stream each chunk to the client as the API writes it.
  buffering:
    responses: false

# kamal-proxy waits this long for in-flight requests before Kamal stops the old container. Render
# allowed the API 60 seconds as well.
drain_timeout: 60
# Then `docker stop -t 60`, for work the API finishes after a response.
stop_timeout: 60
retain_containers: 3

registry:
  server: ghcr.io
  username:
    - KAMAL_REGISTRY_USERNAME
  password:
    - KAMAL_REGISTRY_PASSWORD

builder:
  arch: amd64
  context: ../..
  # Relative to this directory: Kamal passes it to `docker buildx build --file` from here.
  dockerfile: ../../Dockerfile.api
  # The selected buildx builder: Blacksmith's cached builder in CI.
  driver: docker

logging:
  options:
    max-size: 50m

# scripts/lib/release-preflight.test.mjs checks env.secret against .kamal/secrets, the api group
# in scripts/release-preflight.mjs and the API keys in render.yaml.
env:
  clear:
    NODE_ENV: production
    PORT: "3001"
    # The Electric accessory below, on Kamal's private Docker network. It lives here rather than
    # in Infisical `/api` because that folder also syncs to the Render API, which keeps its own
    # Electric until the cutover.
    ELECTRIC_URL: http://opencompany-api-electric:3000
  secret:
    - API_DATABASE_URL
    - API_DB_POOL_MAX
    - API_BROWSER_ORIGINS
    - OPENCOMPANY_API_ORIGIN
    - WORKOS_CLIENT_ID
    - WORKOS_MOBILE_CLIENT_ID
    - WORKOS_API_KEY
    - WORKOS_COOKIE_PASSWORD
    - WORKOS_COOKIE_NAME
    - WORKOS_COOKIE_DOMAIN
    - OPENCOMPANY_AUTHKIT_DOMAIN
    - OPENCOMPANY_API_OAUTH_AUDIENCE
    - OPENCOMPANY_DEFAULT_CHAT_MODEL
    - INTEGRATION_CREDENTIAL_ENCRYPTION_KEY
    - VERCEL_AI_GATEWAY_API_KEY
    - OPENCOMPANY_NEXT_PUBLIC_APP_URL
    - OPENCOMPANY_STRIPE_API_KEY
