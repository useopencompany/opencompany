accessories:
  # The durable browser read layer behind the API's read-model proxy. Its volume and replication
  # stream form one stateful unit: docs/electric-sync.md covers a rebuild. `kamal deploy` leaves a
  # running accessory alone; `kamal accessory reboot electric` restarts it.
  electric:
    host: 91.99.204.222
    # The same digest as render.yaml, so both stacks run the same Electric build.
    image: docker.io/electricsql/electric@sha256:c9c666a59e12d7d10e0ff6c3619a3a39569ae15236b1023655c422d844da5fa7
    # No published port: only the API reaches it, as opencompany-api-electric on the kamal network.
    volumes:
      - opencompany-electric-data:/var/electric
    env:
      clear:
        ELECTRIC_STORAGE_DIR: /var/electric
        # Its own publication and replication slot, so it warms beside the Render Electric
        # (opencompany_render_v1) without contending for either.
        ELECTRIC_REPLICATION_STREAM_ID: opencompany_hetzner_v1
      secret:
        # Infisical `/electric` holds DATABASE_URL. The deploy job exports it as
        # ELECTRIC_DATABASE_URL, because a plain DATABASE_URL would mean something else in a job
        # that also loads `/api` and `/release`.
        - DATABASE_URL:ELECTRIC_DATABASE_URL
        - ELECTRIC_SECRET
    options:
      stop-timeout: 60

ssh:
  user: main
