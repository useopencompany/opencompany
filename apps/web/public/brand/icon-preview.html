<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OpenCompany Icons</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        margin: 0;
        background: #f4f4f5;
        color: #18181b;
      }

      main {
        max-width: 1040px;
        margin: 0 auto;
        padding: 48px 24px;
      }

      h1 {
        margin: 0 0 24px;
        font-size: 24px;
        font-weight: 600;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 16px;
      }

      .tile {
        display: grid;
        gap: 12px;
        padding: 16px;
        border: 1px solid #e4e4e7;
        border-radius: 8px;
        background: #fff;
      }

      .swatch {
        display: grid;
        min-height: 220px;
        place-items: center;
        border-radius: 6px;
      }

      .swatch.light {
        background: #fff;
      }

      .swatch.dark {
        background: #050505;
      }

      .swatch.checker {
        background:
          linear-gradient(45deg, #e4e4e7 25%, transparent 25%),
          linear-gradient(-45deg, #e4e4e7 25%, transparent 25%),
          linear-gradient(45deg, transparent 75%, #e4e4e7 75%),
          linear-gradient(-45deg, transparent 75%, #e4e4e7 75%);
        background-color: #fff;
        background-position:
          0 0,
          0 10px,
          10px -10px,
          -10px 0;
        background-size: 20px 20px;
      }

      img {
        width: 168px;
        height: 168px;
      }

      code {
        overflow-wrap: anywhere;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>OpenCompany Icons</h1>
      <section class="grid" aria-label="Icon variants">
        <article class="tile">
          <div class="swatch dark">
            <img src="/brand/opencompany-mark-light.svg" alt="Light mark" />
          </div>
          <code>/brand/opencompany-mark-light.svg</code>
        </article>
        <article class="tile">
          <div class="swatch light">
            <img src="/brand/opencompany-mark-dark.svg" alt="Dark mark" />
          </div>
          <code>/brand/opencompany-mark-dark.svg</code>
        </article>
        <article class="tile">
          <div class="swatch checker">
            <img src="/brand/opencompany-icon-dark.svg" alt="Dark app icon" />
          </div>
          <code>/brand/opencompany-icon-dark.svg</code>
        </article>
        <article class="tile">
          <div class="swatch checker">
            <img src="/brand/opencompany-icon-light.svg" alt="Light app icon" />
          </div>
          <code>/brand/opencompany-icon-light.svg</code>
        </article>
        <article class="tile">
          <div class="swatch checker">
            <img src="/favicon.svg" alt="Favicon" />
          </div>
          <code>/favicon.svg</code>
        </article>
        <article class="tile">
          <div class="swatch checker">
            <img src="/icon-traced.svg" alt="Large preview icon" />
          </div>
          <code>/icon-traced.svg</code>
        </article>
      </section>
    </main>
  </body>
</html>
