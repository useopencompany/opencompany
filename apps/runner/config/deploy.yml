# The release workflow deploys this from apps/runner with `kamal deploy`. docs/hosting.md covers
# the server, the manual commands, the TLS certificate and the Render cutover.
service: opencompany-runner
image: useopencompany/opencompany-runner

servers:
  web:
    hosts:
      - 91.99.204.222
    options:
      # For a `docker stop` without -t, such as a daemon restart.
      stop-timeout: 300

proxy:
  # The runner serves browsers, sandboxes and signed workspace previews, so it sits behind
  # kamal-proxy like the API. Let's Encrypt's HTTP challenge cannot issue the wildcard, so
  # .github/workflows/renew-runner-cert.yml issues one certificate for all three hosts with a DNS
  # challenge and stores it in Infisical `/runner`. kamal-proxy reads it on each deploy.
  ssl:
    certificate_pem: RUNNER_TLS_CERTIFICATE_PEM
    private_key_pem: RUNNER_TLS_PRIVATE_KEY_PEM
  hosts:
    - runner.opencompany.chat
    - work.opencompany.space
    - "*.work.opencompany.space"
  app_port: 3040
  healthcheck:
    path: /healthz
    interval: 3
    timeout: 5
  # Dictation and chat streams hold a request open; see apps/api/config/deploy.yml.
  response_timeout: 0
  buffering:
    responses: false

# kamal-proxy stops routing to the old runner after 30 seconds of in-flight requests. Then
# `docker stop -t 300`: the runner stops claiming and drains its jobs within the 300 seconds
# Render allowed too (apps/runner/src/index.ts).
drain_timeout: 30
stop_timeout: 300
# Boot and the first /healthz answer must finish within this.
deploy_timeout: 120
retain_containers: 3

registry:
  server: ghcr.io
  username:
    - KAMAL_REGISTRY_USERNAME
  password:
    - KAMAL_REGISTRY_PASSWORD

builder:
  arch: amd64
  context: ../..
  # Relative to this directory: Kamal passes it to `docker buildx build --file` from here.
  dockerfile: ../../Dockerfile.runner
  # The selected buildx builder: Blacksmith's cached builder in CI.
  driver: docker

logging:
  options:
    max-size: 50m

# scripts/lib/release-preflight.test.mjs checks env.secret against .kamal/secrets, the runner group
# in scripts/release-preflight.mjs and the runner keys in render.yaml.
